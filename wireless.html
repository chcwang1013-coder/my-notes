<body>
<header>
  <h1>📡 <span class="em">無線通訊</span>知識庫</h1>

<script>



const CATS={
 "物理":{name:"場與電磁波基礎",raw:"#0891b2"},
 "工程":{name:"把資訊放進電磁波",raw:"#059669"},
 "容量":{name:"容量危機與四次突破",raw:"#7c3aed"},
 "極限":{name:"物理極限與現況",raw:"#e11d48"}
};
function L(id){return '<a class="wl" data-id="'+id+'">'+id+'</a>';}
const NOTES=[
{id:"場與靜電場",ch:"1",en:"Ch.1 · Fields & Electrostatic Field",cat:"物理",html:`<div class="callout"><b>這章的問題：</b>「場」到底是什麼？梳子梳過頭髮能吸起碎紙屑，這個小學實驗跟 WiFi 有什麼關係？</div>
<h3>場是看不見但能量測的實體</h3><p>物理學裡的<b>場</b>是遍布空間、具備能量的實體，最熟悉的例子是決定行星軌道的重力場。無線通訊要用的是<b>電磁場</b>——它不是比喻或哲學概念，而是宇宙中無處不在、取之不盡的物理實體。後面所有技術本質上都是在「操弄場」，而不是傳送某種粒子。</p>
<h3>電荷與靜電場</h3><p>電荷是物質的基本屬性，就像質量一樣。電荷<b>靜止</b>時在周圍產生一圈能量光環，稱為<b>靜電場（E 場）</b>。它固定、不可見，但會對其他電荷施加推力或引力——這正是我們間接證明它存在的方式。</p>
<h3>梳子吸紙屑：把場的作用拆到微觀</h3><p><b>① 摩擦起電</b>：塑膠梳子對電子的束縛力比頭髮強，摩擦時從頭髮搶走自由電子。電子帶負電，所以頭髮帶正電、梳子帶負電。</p>
<p><b>② 梳子周圍形成 E 場。</b></p>
<p><b>③ 感應帶電</b>：碎紙屑本身中性，但在 E 場作用下內部電荷重新排列——帶正電的原子核被引力拉向梳子，帶負電的電子被斥力推離。結果紙屑靠近梳子那側帶正電、遠離那側帶負電。</p>
<p><b>④ 為什麼淨力是吸引</b>（最關鍵、最常被跳過的一步）：紙屑同時受兩個力，<b>近端正電側距離近、場強大 → 引力強</b>；<b>遠端負電側距離遠、場強小 → 斥力弱</b>。強引力勝過弱斥力，合力指向梳子。</p>
<p><b>為什麼值得完整走一遍</b>：它示範了電磁學反覆出現的思路——<b>場的強度隨距離變化，而這個「不均勻」正是產生淨效應的原因</b>。若場處處均勻，正負兩側受力完全抵消，紙屑不會動。</p>
<h3>跟無線通訊的關係</h3><p>只需記住一件事：<b>電荷周圍有場，場能對遠處的電荷施力</b>——電荷之間可以「隔空互相影響」，不需任何實體連接。但靜止電荷只能產生靜態的場，傳不出資訊。要讓資訊跑起來，電荷必須動 → ${L("電流與磁場")}。</p>`},
{id:"電流與磁場",ch:"2",en:"Ch.2 · Current & Magnetic Field",cat:"物理",html:`<div class="callout"><b>這章的問題：</b>電荷靜止產生電場，那電荷「動起來」會發生什麼？為什麼會冒出一種方向繞著電流轉圈的新東西？</div>
<h3>電荷一動，第二種場就出現</h3><p>電荷運動形成<b>電流</b>，就會產生<b>磁場（B 場）</b>。這是故事裡的第一個轉折：自然界不只有一種場，而第二種場是由「運動」這件事本身激發出來的。</p>
<h3>磁場的形狀：繞著電流打轉</h3><p>磁場最反直覺的是它的<b>方向</b>。靜電場從電荷向外輻射，是「徑向」的；磁場不是——<b>它繞著電流打轉</b>。可以想像電流周圍被畫上一圈圈看不見的跑道，小磁針放進去會順著跑道轉，許多小磁針的方向連起來就是<b>磁力線</b>。</p>
<p><b>為什麼要強調這個垂直／繞圈的幾何</b>：電場與磁場方向互相垂直，而電磁波的傳播方向又同時垂直於兩者。這個三維垂直關係決定了天線該怎麼擺、極化是什麼意思、以及為什麼收發天線方向不對就收不到訊號。</p>
<h3>一個幫助想像的比喻</h3><p>把電流想成通風管道裡的氣流，旁邊裝一個可自由旋轉的風扇：靜止的空氣（靜止電荷）不會讓風扇轉；空氣一流動（形成電流），與氣流垂直的風扇就轉起來，像有股「繞著氣流轉動的力」憑空出現。</p>
<p><b>但必須強調這只是幫助想像</b>：磁場不是任何介質流動造成的，它是場本身的性質。這一點在談 ${L("馬克士威方程組與電磁波")} 時會變得極關鍵——那正是十九世紀物理學家最難跨過的坎。</p>
<h3>目前的圖像</h3><p>靜止電荷 → 電場；運動電荷 → 磁場。看起來電與磁是兩件相關但獨立的事。直到有人反過來問：<b>磁能不能生電？</b> → ${L("法拉第電磁感應")}</p>`},
{id:"法拉第電磁感應",ch:"3",en:"Ch.3 · Faraday Induction",cat:"物理",html:`<div class="callout"><b>這章的問題：</b>磁能不能反過來生電？為什麼把磁鐵靜靜放在導線旁什麼也不會發生？而且關鍵真的是「磁鐵在動」嗎？</div>
<h3>關鍵發現：靜止的磁場什麼也不會發生</h3><p>法拉第做了實驗，結果出乎意料——把磁鐵放在導線旁邊，什麼事都沒有。<b>只有磁場發生變化時</b>，才能在導線中誘導出電流與電壓，這稱為<b>電磁感應</b>。</p>
<p>線圈與磁鐵保持靜止 → 沒有電流；迅速把磁鐵推入線圈 → 立刻產生電流；再拉出來 → 產生<b>方向相反</b>的電流。</p>
<div class="formula">ε ∝ dΦ_B/dt　（產生的電壓正比於磁場「變化的速率」）</div>
<p><b>「變化率」三個字是整章的核心。</b> 不是磁場的大小決定電壓，而是磁場<b>改變得多快</b>決定電壓。這個看似技術性的細節，後面會直接決定為什麼無線通訊必須使用<b>高頻</b>（見 ${L("載波與調制")}）——頻率越高、變化越快、能激發的效應越強。</p>
<h3>微觀上發生了什麼</h3><p>一句話：<b>磁場的變化推動導體裡的電子跑起來，電子一跑就形成電流。</b>金屬導體內有大量自由電子，像操場上四處奔跑的學生，平時各跑各的、沒有統一方向。磁場一掃過導體，就像操場旁突然推來一道欄杆，<b>給所有電子一個統一方向的推力</b>，原本雜亂的電子被推成整齊隊伍、開始有序移動。</p>
<h3>一個常見的誤解</h3><p>很多人以為「必須是磁鐵在動」——<b>這是錯的</b>。核心是<b>磁場的變化</b>，不是磁鐵的運動。磁鐵不動而線圈在動、或兩者都不動但用電磁鐵改變磁場強度，效果都一樣。真正重要的是<b>導體所處位置的磁場有沒有隨時間改變</b>。</p>
<h3>深層意義</h3><p>法拉第證明了電場與磁場<b>並非互相獨立，而是同一枚硬幣的兩面</b>。只要有人注意到「磁生電有了，那電生磁呢」這個不對稱，電磁波就呼之欲出 → ${L("馬克士威方程組與電磁波")}。</p>`},
{id:"馬克士威方程組與電磁波",ch:"4",en:"Ch.4 · Maxwell & EM Waves",cat:"物理",html:`<div class="callout"><b>這章的問題：</b>補上「電生磁」這塊拼圖後，為什麼會憑空冒出一種<b>不需要介質</b>、能自己往前跑的波？「光就是電磁波」怎麼得出的？</div>
<h3>一個對稱性的假設</h3><p>法拉第證明「變化的磁場 → 產生電場」。馬克士威收集所有已知電磁定律後，憑數學洞察提出關鍵假設：<b>為了保持物理定律的對稱性，變化的電場也應該能產生磁場。</b></p>
<p><b>注意這個假設的來源</b>：它不是來自實驗，而是來自「物理應該對稱」的結構性直覺——這是理論物理最經典的思路：用對稱性補上缺失的一塊，再看能推導出什麼。</p>
<h3>循環一旦閉合就停不下來</h3><p>① 某處有變化的電場 → ② 產生變化的磁場 → ③ 又在稍遠處產生變化的電場 → ④ 回到 ①，向外不斷推進。電場與磁場交替出現、互相推動、互相維持，形成一個<b>脫離源頭、以固定速度向外傳播的能量振動</b>——這就是<b>電磁波</b>。</p>

<p><b>關鍵在「脫離源頭」四個字</b>：連鎖反應一旦啟動就不再需要原本振盪的電荷。源頭消失，已發出的波依然繼續傳播——這正是無線通訊得以成立的物理前提。</p>
<h3>最反直覺的一點：不需要介質</h3><p>水波以水為介質、聲波以空氣為介質，所以當時的人自然問：電磁波在振動「什麼」？答案是——<b>什麼都不振動</b>。電磁波不是在介質中傳播的波，而是<b>「場自身的激發」在傳播</b>，就是「電生磁、磁生電」這個循環現象本身在向外擴散。（歷史上曾假設有「以太」，後被實驗否定。）</p>
<p><b>這直接決定了無線通訊的可能性</b>：正因不需介質，電磁波才能穿越真空、跨越太空、在沒有任何實體連接下把資訊送到遠方。</p>
<h3>那個偉大的巧合</h3><p>馬克士威計算這種波的傳播速度，結果與天文觀測的<b>光速</b>高度吻合。這不是巧合，是揭示：<b>光就是電磁波</b>。很久之後人類才發現無線電波、紅外線、可見光、紫外線、X 射線、伽馬射線<b>本質全是同一種現象</b>，唯一差別只在頻率與波長 → ${L("電磁波頻譜與波長頻率")}。</p>`},
{id:"電磁波頻譜與波長頻率",ch:"5",en:"Ch.5 · Spectrum, λ & f",cat:"物理",html:`<div class="callout"><b>這章的問題：</b>名字差這麼多的射線為什麼是同一件事？「波長」對看不見的波是什麼意思？為什麼 c=λf 綁死了後面一百年的工程？</div>
<h3>人類是「倒著」發現頻譜的</h3><p>人類幾十萬年只看得見可見光。後來用稜鏡分解陽光，做了兩個對稱的實驗：在<b>紅光外側</b>的陰影區放溫度計，溫度反而升更高（沒有光卻有強烈熱效應）→ 命名為<b>紅外線</b>，當時只當成「熱射線」；在<b>紫光外側</b>放浸過氯化銀的試紙，分解速度比在紫光下更快 → 發現<b>紫外線</b>，當時只當成「化學射線」。</p>
<p><b>關鍵洞察</b>：這些名字是在<b>不知道它們本質相同</b>的年代隨手取的。站在今天回看，<b>本質上只是我們給不同頻率的電磁波分了段，再給每段一個人為命名而已</b>。真實情況是反過來的：不同頻率的電磁波一直存在，只是人眼剛好只對某一段有反應。</p>
<h3>波長的本質</h3><p>頻率好理解，就是單位時間內電場與磁場互相生成的次數。波長比較不直觀——最本質的說法是：<b>波長就是波動在「空間上」的週期性</b>。沿傳播方向每前進一個波長，振動狀態重複一次。所以不一定要選波峰，<b>任意兩個振動狀態相同的相鄰點，距離就是波長</b>。例如紅光波長約 600nm，意思是路徑上每隔 600nm 電場的振動狀態就完全重複。</p>
<h3>那條綁死一切的式子</h3><div class="formula">c = λ f　⟹　λ = c / f　（光速恆定）</div>

<p><b>波長越長 ⟺ 頻率越低；頻率越高 ⟺ 波長越短。這是寫死在物理定律裡的，工程無法改變。</b>你不可能設計出「頻率又高、波長又長」的電磁波。</p>
<p><b>接下來一百多年人類駕馭電磁波的整部歷史，本質上都是在跟這條式子討價還價。</b>後面幾乎每個難題——為什麼需要載波（${L("載波與調制")}）、為什麼 5G 基站要蓋這麼多（${L("頻率的雙刃劍")}）——追根究柢都指回這裡。</p>
<h3>頻譜分段</h3><p>伽馬射線（&lt;0.01nm，殺癌細胞）→ X 射線（0.01–10nm，醫學影像）→ 紫外線（10–400nm，殺菌）→ 可見光（400–760nm）→ 紅外線（760nm–1mm，熱效應）→ <b>無線電波（&gt;1mm，無線通訊使用）</b>。</p>
<p><b>注意最後一段的跨度</b>：都叫無線電波，波長卻可以從幾毫米到幾公里。這個範圍內的差異極大，而差異的後果正是後面所有工程取捨的來源。</p>`},
{id:"赫茲實驗與天線原理",ch:"6",en:"Ch.6 · Hertz & Antenna",cat:"工程",html:`<div class="callout"><b>這章的問題：</b>馬克士威的電磁波當初只是數學預言，怎麼被實驗證實？天線看起來只是一根金屬棒，它到底在做什麼？</div>
<h3>從數學預言到實驗室的火花</h3><p>赫茲的裝置概念上很簡單：<b>發射端</b>是一個帶火花間隙的發射器，高壓電通過間隙產生火花——本質上是讓電荷<b>快速震盪</b>，因而製造出快速變化的電場與磁場、向外發射電磁波。<b>接收端</b>在幾公尺外放第二個帶接收天線的火花間隙，捕捉到能量後在間隙中產生<b>微小火花</b>。</p>
<h3>火花之間，資訊已經誕生</h3><p>這個實驗已隱含通訊的雛形：兩個隔音房間事先約定「看到窗外有兔子就按下發射器」，對方看到接收器閃火花，就收到了這條資訊。<b>人類正式從理論進入無線通訊的實踐領域</b>——但只能發送最簡單的「有／沒有」，效率極低。</p>
<h3>天線在做什麼：一個物理轉換器</h3><p>回想法拉第的結論——<b>變化率決定一切</b>。要有效產生電磁波，必須讓電荷進行<b>高頻率、有規律的快速運動</b>，這個裝置就是<b>天線</b>。</p>
<p>沿導線輸入高頻交流電時：① 導線中自由電子沿長度方向<b>上下快速震盪</b> → ② 周圍產生<b>急劇變化的電場</b> → ③ 立即產生<b>變化的磁場</b> → ④ 兩場互相推動，以<b>電磁波形式從天線脫離</b>並向外輻射。</p>
<div class="formula">天線 ＝ 把電訊號（電子運動）⟷ 無線電波（場的波動）的物理轉換器</div>
<p>反過來接收時，入射電磁波推動天線中的電子運動，把場的波動轉回電訊號。<b>發射與接收是同一過程的兩個方向</b>，這也是同一根天線通常既能發也能收的原因。</p>
<h3>為什麼天線尺寸不能隨便決定</h3><p>天線長度必須與所發射的<b>波長</b>同數量級（常見半波長或四分之一波長設計）。由 c=λf：<b>頻率越低 → 波長越長 → 天線必須越大</b>。地球上各種大小天線在原理上完全相同，尺寸差異純粹來自工作頻率。</p>
<p>這個「天線尺寸被波長綁死」的限制，正是 ${L("載波與調制")} 要處理的核心矛盾——也是無線通訊史上最漂亮的一次繞道。</p>`},
{id:"電報與摩斯電碼",ch:"7",en:"Ch.7 · Telegraph & Morse",cat:"工程",html:`<div class="callout"><b>這章的問題：</b>赫茲的火花只能傳「有／沒有」，怎麼變成跨越大西洋的系統？只用點與劃兩種訊號，為什麼能傳遞任意複雜的資訊？</div>
<h3>兩個必須同時解決的挑戰</h3><p>馬可尼面對：① 怎麼把資訊「寫進」電磁波？② 怎麼讓訊號傳更遠？</p>
<h3>挑戰一：用兩種訊號編碼任意資訊</h3><p>馬可尼只是從一種訊號變成<b>兩種</b>：短訊號（<b>點</b>）與長訊號（<b>劃</b>）。真正的突破來自<b>摩斯電碼</b>——利用兩者的不同組合建立編碼方式。例如 SOS 是「三短、三長、三短」，被選為國際通用正是因為節奏對稱、容易記憶辨識。</p>
<p><b>這裡藏著極重要的思想</b>：資訊的複雜度不必來自訊號本身的複雜度，而可以來自<b>編碼</b>。兩種狀態就足以表達任意複雜的訊息——只要有夠好的編碼規則。這個思想幾十年後會以更徹底的形式回歸 → ${L("類比訊號與數位訊號")}。</p>
<h3>通斷調制：所有數位調制的鼻祖</h3><p>操作員按下電鍵時振盪器工作、天線發射；鬆開則停止。於是<b>資訊被編碼成「電磁波的持續時間」</b>：短脈衝＝點，長脈衝＝劃。這稱為<b>通斷調制（On-Off Keying）</b>，是所有數位調制方式的鼻祖。電磁波至此不再只是物理現象，而是<b>被人類操控、成為資訊流的載體</b>。</p>
<h3>挑戰二：怎麼傳得更遠</h3><p>提高發射功率確保衰減後仍可偵測；把天線一端接地、另一端接到高聳金屬結構上（後來甚至用風箏或氣球把天線吊到空中），最大限度提高輻射效率與覆蓋範圍。1901 年馬可尼在大西洋彼岸收到來自 3400 多公里外的摩斯電碼訊號。</p>
<h3>檢波器：把電磁波變回訊號</h3><p>核心元件是裝滿鬆散金屬粉末的玻璃管：① <b>待機</b>時粉末鬆散、接觸不良，電路斷開（高電阻）→ ② 電磁波擊中天線，在兩端產生微弱脈衝 → ③ 粉末<b>凝聚在一起</b>形成低電阻通路 → ④ 電流通過，點亮燈或驅動記錄儀寫下點或劃 → ⑤ 小錘子自動敲打玻璃管把粉末<b>重新震鬆</b>，恢復待機。</p>
<p><b>為什麼值得細看</b>：它示範了早期工程的核心思路——<b>用「電磁波能量引起物質狀態變化」來偵測訊號</b>。微弱能量無法直接驅動顯示裝置，但足以觸發一個狀態切換，而狀態切換可以接上更大的電源做放大。這個「用小訊號控制大能量」的概念，正是後來所有放大器與數位邏輯的雛形。</p>`},
{id:"載波與調制",ch:"8",en:"Ch.8 · Carrier & Modulation",cat:"工程",html:`<div class="callout"><b>這章的問題：</b>人聲頻率換算成電磁波，波長是 300 公里——天線根本做不出來。那廣播是怎麼實現的？</div>
<h3>先看清楚這個死結</h3><p>人聲頻率約 300–3400 Hz。取中位數 1000 Hz，由 λ=c/f：</p>
<div class="formula">λ = 3×10⁸ / 1000 = 300,000 公尺 = 300 公里</div>
<p>而天線尺寸必須與波長同數量級。要有效發射 1000 Hz，天線可能需要長達<b>上百公里</b>——物理與經濟上都不可行。<b>這就像你不能用一公尺長的砲管，去發射十公尺長的砲彈。</b></p>
<h3>兩條走不通的路</h3><p><b>直接把人聲頻率提高？</b>不行。乘以 2 就變得非常尖銳，提高幾十倍會尖到人耳聽不見——<b>原始資訊徹底丟失</b>。而且真正需要的幅度遠不止如此：若要讓天線降到 1 公尺，頻率至少要 75 MHz，意味著把人聲提高<b>二十二萬倍以上</b>。</p>
<h3>關鍵的繞道：載波</h3><p><b>載波</b>是一種非常高頻、純淨、恆定的正弦波，<b>本身不攜帶任何資訊</b>。因為它是極高頻的，波長很短，所以<b>可以用小而方便的天線高效發射</b>。載波就像一張<b>空白信紙</b>——只要改變它的某些物理屬性（在信紙上寫字），就能承載資訊。</p>
<h3>調制：把低頻資訊寫進高頻載波</h3><p><b>調幅（AM）</b>：輸入訊號響度大時讓載波<b>振幅變高</b>、小時變低，頻率保持不變。接收端量測高度變化即可還原。</p>
<p><b>調頻（FM）</b>：讓載波的<b>頻率發生微小偏移</b>，而強度保持不變。接收端根據頻率的細微變化解碼。</p>

<p><b>FM 的巧妙之處</b>：我們不是「用頻率本身傳資訊」，而是<b>利用頻率的微小變化傳資訊</b>。因為載波頻率遠高於人聲，這些微小偏移不會影響載波的發射效率——<b>高頻的發射優勢被完整保留了</b>。</p>
<div class="formula">不再直接發射資訊，而是發射一個容易發射的高頻載體，再讓資訊去雕塑它的形狀</div>
<h3>現代：把一維雕塑變成二維</h3><p>WiFi/4G/5G 使用<b>正交振幅調制（QAM）</b>，<b>同時改變載波的振幅與相位</b>，相當於把「雕塑無線電波」從一維提升到二維，在二維平面上安排更多可區分的狀態，一個載波就能編碼更多資料。但原理上與百年前的廣播一脈相承。（分析這個編碼過程的數學工具正是<b>傅立葉變換</b>。）</p>`},
{id:"頻譜帶寬與香農定理",ch:"9",en:"Ch.9 · Bandwidth & Shannon",cat:"工程",html:`<div class="callout"><b>這章的問題：</b>上網天天講「帶寬」，這詞從哪來？為什麼一個電台佔的是「一段頻率」而不是「一個頻率」？</div>
<h3>帶寬的物理定義</h3><p><b>帶寬</b>是一個訊號佔用的<b>頻率範圍</b>。關鍵事實：無線訊號並非只佔一個固定頻率，而會覆蓋一段連續範圍，這段寬度就是<b>信道帶寬</b>。</p>
<p><b>為什麼會佔一段而非一個點？</b>這是調制的必然結果——回想 FM：讓載波頻率隨資訊輕微變化，既然要變化，就必須為變化預留空間。例如載波 1000 kHz 經調頻後實際在 996.6–1003.4 kHz 間擺動，帶寬即 6.8 kHz。<b>所以帶寬不是工程師隨意選的，而是「用調制解決發射物理限制」必然付出的代價。</b></p>
<h3>香農定理：帶寬為什麼等於速度</h3><div class="formula">C = B · log₂(1 + S/N)</div>
<p>在相同訊號品質下，<b>帶寬越寬，單位時間可傳輸的資料量越大</b>——就像車道越寬，同時能通過的車越多。<b>注意帶寬 B 是線性項，而訊雜比在對數裡面</b>，這代表<b>加大帶寬比提升功率更有效</b>。這正是往後幾十年技術演進的主線都是「用到更寬的頻譜」的原因。</p>
<h3>頻譜是有限且不可再生的</h3><p>電磁波頻譜像土地一樣總量固定、用掉就沒了，因此必須由政府劃分用途、避免互相干擾。以 FM 廣播為例：核心頻段 88–108 MHz，每台信道帶寬約 200 kHz、相鄰電台間隔也是 200 kHz。</p>
<div class="formula">(108 − 88) MHz ÷ 200 kHz = 20 MHz ÷ 0.2 MHz = 100 個電台</div>
<p>整個 FM 頻段最多只能容納約 <b>100 個電台</b>。用旋鈕式老收音機可親手驗證：慢慢調頻率會聽到聲音變糊、雜音變多，中間有一小段能<b>同時模糊聽到兩個電台</b>（互相干擾），繼續調就完成換台。</p>
<h3>廣播夠用，手機不夠</h3><p>廣播以省市為單位覆蓋，相隔很遠的地區可用同一頻段（這已隱含後面「頻率複用」的思想）。但廣播是<b>一個電台佔固定頻段、單向發射</b>；手機則是<b>成千上萬用戶同時雙向交互</b>。沿用固定分配邏輯，即使用上整個頻段也只能容納極少數人同時通話。<b>頻譜有限而需求無限，這個矛盾將引爆四次技術突破</b> → ${L("蜂窩網路與頻率複用")}。</p>`},
{id:"蜂窩網路與頻率複用",ch:"10",en:"Ch.10 · Cellular & Frequency Reuse",cat:"容量",html:`<div class="callout"><b>這章的問題：</b>第一個突破口在哪？為什麼「把大電台拆成無數小電台」反而能容納更多人？為什麼小區是六邊形？</div>
<h3>問題重述</h3><p>關鍵在於——<b>不管大型基站覆蓋範圍多廣，它能用的頻段都是有限的</b>。覆蓋大並不會讓可用頻譜變多，反而是範圍內所有用戶都要擠在同一份有限頻譜裡。</p>
<h3>蜂窩概念</h3><p>核心是反直覺的：<b>不用一個大基站覆蓋廣大範圍，而是切割成很多小型「蜂窩小區」，各由低功率基站負責。</b></p>
<p><b>為什麼叫蜂窩</b>：小區以<b>六邊形</b>為模型——六邊形能<b>無間隙鋪滿平面</b>，且形狀最接近圓形（基站實際覆蓋是圓形），用最少小區覆蓋最大面積且不留空隙。</p>
<h3>為什麼反而能容納更多人：頻率複用</h3><p><b>相鄰小區</b>用不同頻段避免干擾；但<b>相隔足夠遠的小區</b>訊號本來就不會互相干擾——<b>所以可以重複使用相同頻段</b>。這就是<b>頻率複用</b>，讓同一份頻譜在一座城市裡被使用幾十、幾百次。</p>

<h3>容量不夠：微蜂窩</h3><p>把小區<b>再拆更小</b>（降低基站功率、縮小覆蓋）。效果是：<b>在完全不新增頻譜的情況下增加複用次數</b>。</p>
<div class="formula">核心智慧：容量不是靠爭取更多頻譜，而是靠把同一份頻譜在空間上重複使用更多次</div>
<p>這也解釋了為什麼都市基站密度遠高於郊區——不是訊號比較差，而是要用更密的小區換取更高容量。</p>
<h3>移動中怎麼辦：越區切換</h3><p>基站<b>即時監測用戶訊號強度</b>，當用戶移到小區邊緣，系統自動把通話<b>切換到相鄰小區的空閒信道</b>，對用戶<b>無感</b>。這是整套系統中最易被忽略、工程上卻極精巧的一環：要求相鄰基站即時協調、毫秒等級完成交接、且不中斷傳輸。</p>`},
{id:"類比訊號與數位訊號",ch:"11",en:"Ch.11 · Analog vs Digital",cat:"容量",html:`<div class="callout"><b>這章的問題：</b>類比與數位到底差在哪？為什麼改用 0 與 1 之後，不只解決失真，還順便解決了「怎麼傳圖片」？</div>
<h3>類比：讓電磁波「模仿」原始訊號</h3><p>AM 與 FM 都屬類比——<b>用電磁波的變化直接模仿聲波的變化</b>。聲音響一點載波振幅就高一點，波形怎麼起伏載波就怎麼跟著起伏。但有兩個致命問題：</p>
<p><b>① 失真無法修復</b>：既然是一一對應，傳輸中的任何干擾與衰減都會被<b>忠實地當成原始訊號的一部分</b>還原出來，接收端無法分辨。</p>
<p><b>② 非波形的資訊怎麼辦</b>：聲音是波可以對應，但一張<b>圖片</b>不是波，很難找出它與電磁波變化之間的自然對應。</p>
<h3>數位：先翻譯成 0 與 1</h3><p>思路完全不同且相當粗暴有效：<b>不管三七二十一，先把所有資訊（聲音、圖片、文字）全部轉成二進位的 0 和 1</b>，再用這串位元去調制載波。例如振幅<b>變化大＝1</b>、<b>變化小＝0</b>。接收端因此只需判斷訊號是「高」還是「低」。</p>
<h3>為什麼就解決了失真</h3><p>即便訊號略微失真，只要接收端還能<b>大致區分變化是大是小</b>，就能正確判定 0 或 1。<b>一旦判定正確，資訊就是「完美還原」</b>——不是接近原始，而是與原始位元完全相同。</p>
<p>對比：<b>類比</b>的雜訊直接疊加到結果、且每經一次中繼放大就累積一次；<b>數位</b>只要雜訊沒大到混淆兩種狀態就<b>零誤差</b>，中繼站還能重新判定並<b>產生乾淨訊號</b>，雜訊不累積。</p>
<p><b>這個「門檻式判定」是數位壓倒類比的根本原因</b>：它把「連續、無限精度、無法修復」的問題，轉化成「離散、有限狀態、可以修復」的問題。</p>
<h3>順便解決了「傳什麼都可以」</h3><p>不需要為每種媒體發明對應的物理調制方式，只要先編碼成位元流，傳輸系統就完全不必關心內容是什麼。<b>這是極重要的架構性突破</b>：把「資訊內容」與「資訊傳輸」徹底解耦，傳輸系統變成一條通用管道。今天手機能同時打電話、傳照片、看影片，根源就在這裡。而這個思想在 ${L("電報與摩斯電碼")} 的年代就已萌芽。</p>`},
{id:"CDMA碼分多址",ch:"12",en:"Ch.12 · CDMA",cat:"容量",html:`<div class="callout"><b>這章的問題：</b>蜂窩已越切越小但用戶還在增加。有沒有辦法讓同一小區裡所有人<b>同時用同一個頻段</b>卻不互相干擾？</div>
<h3>小區不能無限切下去</h3><p>基站不可能無限增加（成本、選址、越區切換複雜度都會爆炸），需要一個<b>在同一小區內部再擠出容量</b>的方法。</p>
<h3>核心邏輯：用編碼區分，而非頻率或時間</h3><p><b>CDMA（碼分多址）</b>的作法相當大膽：<b>大家共享同一個頻段，靠「編碼」區分用戶。</b>同一小區裡允許所有人在同一時間、用同一頻段發送，基站把收到的所有訊號一起發給每個人。</p>
<p>那怎麼避免干擾？<b>秘密在每台手機上</b>：每台裝置給自己的資訊<b>加上獨特的密碼</b>——像給箱子加上不同的密碼鎖，而接收端<b>只解得開自己認識的那套</b>，其他人的資訊被自動過濾。</p>
<p><b>巧妙之處</b>：前面的技術都在「分配資源」——分頻段（廣播）、分空間（蜂窩）。CDMA 跳出這個框架，<b>不分配任何東西，讓所有人重疊在一起，改用數學上的「可分離性」還原各自訊號</b>。（這需要精心設計的正交碼組，使得用自己的碼去解讀別人訊號時結果會平均掉、趨近於零。）</p>
<h3>代價：偽雜訊的頻寬浪費</h3><p>為了讓訊號能被密碼分開，CDMA <b>必須把原始訊號用很寬的偽隨機碼擴展</b>（擴頻）——一段本來只需窄頻寬的資訊，被刻意攤開到很寬的頻段上。這意味著傳輸了大量冗餘，術語稱為<b>偽雜訊的代價</b>。</p>
<p>直接後果是<b>犧牲頻寬效率</b>：同樣的頻譜能承載的有用資料量下降，這正是那個年代手機上網速度很慢的原因。</p>
<p><b>把這件事看清楚很重要</b>：CDMA 解決了「多人共存」，但它是<b>用頻寬效率換來的</b>——讓更多人能同時通話，卻沒讓每個人變快。這個未被滿足的需求，直接催生了 ${L("OFDM正交頻分複用")}。</p>`},
{id:"OFDM正交頻分複用",ch:"13",en:"Ch.13 · OFDM",cat:"容量",html:`<div class="callout"><b>這章的問題：</b>有沒有辦法既讓多人共用、又讓每個人都變快？為什麼「把一條大車道拆成幾千條小車道」反而更有效率？</div>
<h3>比蜂窩更徹底的分而治之</h3><p><b>OFDM（正交頻分複用）</b>延續蜂窩的「分而治之」智慧，但作用在<b>頻率</b>維度：<b>把一個載波的頻段再拆分成很多很多的子載波。</b>透過<b>傅立葉變換</b>（尤其離散形式）與<b>正交性</b>，把一個資訊含量很高的資料流拆成<b>幾千個資訊含量很低的子資料流</b>。因為每個子流資訊含量低，<b>只需要很窄的頻段就能傳輸</b>。</p>
<h3>超級高速公路的比喻</h3><p><b>原本</b>是一條壅塞的寬單車道跑著一輛大貨車；<b>OFDM</b> 改造成幾千條並行窄車道組成的分層高速公路，同時把大貨車拆成很多小車。每個用戶可佔用幾條小車道，不同用戶也能輪流使用，因為車道彼此獨立（正交），只要分配好就不互相干擾。</p>

<h3>為什麼拆散反而更快</h3><p><b>區別一：可動態挑選最好的車道。</b>無線環境中不同頻率受到的干擾與衰落程度不同。基站能以<b>毫秒級精確度即時監測</b>這幾千條窄車道，找出<b>干擾最小、最閒置</b>的，把資料<b>優先分配到最好的車道</b>。這是單一寬載波做不到的——寬載波只能整段一起承受最差那部分的干擾。</p>
<p><b>區別二：資料不必同時全部抵達。</b>線上看影片只要最近一兩分鐘的內容到了就能播放，其餘邊看邊下載。就像把一大車廂食物分成很多小車運到家，<b>只要有一輛抵達就能開始吃</b>。</p>
<h3>影響範圍</h3><p>OFDM 不只讓手機上網變快，也讓家庭上網質變——<b>WiFi 從第四代開始引入 OFDM</b>。WiFi 與基站的差異值得一提：小型 WiFi 只需覆蓋幾十台設備，不像基站要服務成千上萬台，因此每台能分到的帶寬更充裕、速度更快。這背後是兩種設計哲學 → ${L("WiFi與蜂窩網路")}。</p>`},
{id:"頻率的雙刃劍",ch:"14",en:"Ch.14 · The Frequency Trade-off",cat:"極限",html:`<div class="callout"><b>這章的問題：</b>既然帶寬越寬越快，6G、7G 只要一直往更高頻率拿頻譜不就好了？答案是不行——擋住我們的是物理定律。</div>
<h3>頻譜擴張的歷史軌跡</h3><p><b>3G</b>：約 2GHz 中頻，單載波帶寬約 5MHz。<b>4G</b>：約 2–2.6GHz，單載波約 20MHz，並引入<b>載波聚合</b>——把好幾個 20MHz 載波<b>捆綁在一起</b>達到上百 MHz。<b>5G</b>：最高擴展到 3.5GHz 以上，單載波帶寬再放大一個量級。</p>
<p>趨勢很明顯：<b>每一代的主線都是「用到更寬的總帶寬」</b>，因為由香農定理，帶寬直接決定速度。自然的推論是繼續往更高頻率拿——<b>但這條路走不下去。</b></p>
<h3>為什麼走不下去</h3><p>回到 c=λf：光速恆定，所以<b>頻率越高 ⟹ 波長越短</b>。而短波長的電磁波有兩個致命問題：<b>傳播距離短</b>、<b>穿透力差、繞不過障礙物</b>。</p>
<p><b>用聲波類比最好懂</b>：打雷時我們總是只聽到低沉的隆隆聲；在水裡聽岸上的人說話也只聽得到低頻部分。因為<b>低頻聲波波長長、更容易穿透障礙、傳得更遠</b>；高頻則傳不遠、遇障礙就被擋住。電磁波面臨完全相同的問題。</p>
<p><b>極限推演</b>：不斷提高頻率，電磁波最終會變成<b>可見光</b>——而可見光顯然無法穿過日常障礙物，隨便一個東西就擋住了。實際上根本不用到那麼高：5G 引入的 28GHz 波段波長已降到<b>只有幾毫米</b>，繞過障礙物的能力大幅減弱、傳播距離非常短，後果就是必須<b>建立非常多基站</b>並配套大量新技術。</p>
<h3>兩對互相矛盾的雙刃劍</h3><div class="formula">頻率太低 → 波長太長 → 天線做不出來 → 發射不出去<br>頻率太高 → 波長太短 → 傳播距離短、繞射差 → 傳不遠</div>
<p><b>物理定律把我們夾在一個不算太寬的範圍內。</b>整個電磁波頻譜很廣，但人類實際上只能使用其中<b>很窄的一小段</b>做無線通訊。這正是為什麼頻譜是不可再生的珍貴資源——不只總量固定，而是<b>其中真正「好用」的那一段特別窄</b>。</p>
<h3>問題性質的轉變</h3><p>到這個階段，<b>現代通訊面臨的最本質挑戰已不再是純粹的物理學問題，而是頻譜資源的行政管理與經濟分配問題</b> → ${L("WiFi與蜂窩網路")}。</p>`},
{id:"WiFi與蜂窩網路",ch:"15",en:"Ch.15 · WiFi vs Cellular",cat:"極限",html:`<div class="callout"><b>這章的問題：</b>兩套網路用的物理原理與技術幾乎相同，為什麼表現與使用方式差這麼多？為什麼公共場所的陌生 WiFi 不建議做重要的事？</div>
<h3>同樣的物理，不同的哲學</h3><p>WiFi 與蜂窩網路都依賴前面講過的電磁波物理、調制、OFDM 等技術。<b>但服務哲學與頻譜策略截然不同，分歧的根源就是「頻譜怎麼取得」。</b></p>
<h3>WiFi：自由接入</h3><p>運行在<b>不需要政府授權的頻譜</b>上（常見 2.4GHz 與 5GHz），<b>任何人都可以使用</b>。優點是設備<b>成本低廉、部署方便</b>、普及率極高，主要服務家庭或辦公室。</p>
<p>但代價來自同一個原因：因為<b>沒有監管、任何人都能用同一段頻譜</b>，可靠性與安全性無法保障——這正是「做重要的事情時最好不要連陌生 WiFi」的由來。</p>
<p><b>注意這個因果關係</b>：WiFi 的便宜方便與它的不可靠，<b>是同一個設計選擇的一體兩面</b>——開放頻譜必然意味著無人保證你不會被干擾、也無人保證同頻段上的其他人是善意的。</p>
<h3>蜂窩網路：授權獨占</h3><p>運行在<b>政府授權的頻譜</b>上，運營商必須申請並支付費用取得<b>獨占使用權</b>。由於真正好用的頻段極稀缺（見 ${L("頻率的雙刃劍")}），這種授權往往極為昂貴。</p>
<p>獨占帶來的好處是直接的：同區域內<b>沒有其他競爭者</b>使用相同頻段，因此能提供<b>更可靠、更安全</b>的服務，支撐更大範圍的使用者與移動性，同時形成投資基礎建設的商業循環。</p>
<h3>為什麼 WiFi 感覺比較快</h3><p>關鍵在<b>服務對象的數量</b>：小型 WiFi 可能只覆蓋<b>幾十台設備</b>，基站要同時服務<b>成千上萬台</b>。因此 WiFi 分給每台設備的帶寬更充裕。<b>速度不只取決於技術世代，更取決於「這份頻譜要分給多少人用」。</b></p>

const SVGNS='http://www.w3.org/2000/svg';
const G={started:false,nodes:[],edges:[],raf:null};
function startGraph(){
 if(G.started)return;G.started=true;buildLegend();
 const W=svg.clientWidth||900,H=svg.clientHeight||600;
 const deg={};EDGES.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;});
 G.nodes=NOTES.map((n,i)=>({id:n.id,cat:n.cat,x:W/2+Math.cos(i/NOTES.length*6.283)*240+(Math.random()-.5)*40,y:H/2+Math.sin(i/NOTES.length*6.283)*190+(Math.random()-.5)*40,vx:0,vy:0,r:8+(deg[n.id]||1)*1.5}));
 const pos=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 const gE=document.createElementNS(SVGNS,'g'),gN=document.createElementNS(SVGNS,'g');svg.appendChild(gE);svg.appendChild(gN);
 G.edges=EDGES.map(([a,b])=>{const l=document.createElementNS(SVGNS,'line');l.setAttribute('class','gedge');gE.appendChild(l);return{a,b,el:l};});
 G.nodes.forEach(n=>{
  const g=document.createElementNS(SVGNS,'g');g.setAttribute('class','gnode');g.dataset.id=n.id;
  const c=document.createElementNS(SVGNS,'circle');c.setAttribute('r',n.r);c.setAttribute('fill',CATS[n.cat].raw);c.setAttribute('stroke','#ffffff');c.setAttribute('stroke-width','2.5');
  const t=document.createElementNS(SVGNS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('dy',-n.r-6);t.textContent=n.id;
  g.appendChild(c);g.appendChild(t);gN.appendChild(g);n.el=g;
  g.addEventListener('mouseenter',()=>highlight(n.id,true));g.addEventListener('mouseleave',()=>highlight(n.id,false));
  let moved=false,down=false,ox,oy;
  g.addEventListener('pointerdown',ev=>{down=true;moved=false;n.fixed=true;const p=toSvg(ev);ox=p.x-n.x;oy=p.y-n.y;g.setPointerCapture(ev.pointerId);});
  g.addEventListener('pointermove',ev=>{if(!down)return;const p=toSvg(ev);n.x=p.x-ox;n.y=p.y-oy;n.vx=0;n.vy=0;moved=true;});
  g.addEventListener('pointerup',()=>{down=false;n.fixed=false;if(!moved)open(n.id);});
 });
 gloop(pos,W,H);
}
function toSvg(ev){const r=svg.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
function highlight(id,on){const nb=new Set(neighborsOf(id));nb.add(id);
 G.nodes.forEach(n=>{n.el.style.opacity=on?(nb.has(n.id)?1:.2):1;});
 G.edges.forEach(e=>{const rel=(e.a===id||e.b===id);e.el.classList.toggle('hl',on&&rel);e.el.style.opacity=on?(rel?1:.12):1;});}
function gloop(pos,W,H){const KR=5200,KS=0.012,L0=118,DA=0.86,GR=0.008;
 function step(){const ns=G.nodes;
  for(let i=0;i<ns.length;i++){const a=ns[i];if(a.fixed)continue;let fx=0,fy=0;
   for(let j=0;j<ns.length;j++){if(i===j)continue;const b=ns[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);const f=KR/d2;fx+=dx/d*f;fy+=dy/d*f;}
   fx+=(W/2-a.x)*GR;fy+=(H/2-a.y)*GR;a.vx=(a.vx+fx)*DA;a.vy=(a.vy+fy)*DA;}
  EDGES.forEach(([ai,bi])=>{const a=pos[ai],b=pos[bi];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const f=(d-L0)*KS,ux=dx/d,uy=dy/d;if(!a.fixed){a.vx+=ux*f;a.vy+=uy*f;}if(!b.fixed){b.vx-=ux*f;b.vy-=uy*f;}});
  ns.forEach(n=>{if(n.fixed)return;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(n.r+40,Math.min(W-n.r-40,n.x));n.y=Math.max(n.r+30,Math.min(H-n.r-20,n.y));});
  G.edges.forEach(e=>{const a=pos[e.a],b=pos[e.b];e.el.setAttribute('x1',a.x);e.el.setAttribute('y1',a.y);e.el.setAttribute('x2',b.x);e.el.setAttribute('y2',b.y);});
  ns.forEach(n=>n.el.setAttribute('transform','translate('+n.x+','+n.y+')'));
  G.raf=requestAnimationFrame(step);}
 step();}

 ctx.strokeStyle='#123039';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,oy-10);ctx.lineTo(px,oy+44);ctx.stroke();

 // 天線示意

function toolMod(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>載波頻率（相對） <span id="mdCV">26</span><input id="mdC" type="range" min="8" max="50" value="26"></label>'+
  '<label>訊息頻率 <span id="mdMV">1.5</span><input id="mdM" type="range" min="5" max="40" value="15"></label>'+
  '<label>調制深度 <span id="mdDV">0.75</span><input id="mdD" type="range" min="0" max="95" value="75"></label>'+
  '</div><canvas id="mdCanvas" width="640" height="330"></canvas>'+
  '<div class="d" id="mdNote"></div></div>';
 ['mdC','mdM','mdD'].forEach(id=>document.getElementById(id).oninput=drawMod);
 drawMod();
}
function drawMod(){
 const fc=+document.getElementById('mdC').value;
 const fm=(+document.getElementById('mdM').value)/10;
 const d=(+document.getElementById('mdD').value)/100;
 document.getElementById('mdCV').textContent=fc;
 document.getElementById('mdMV').textContent=fm.toFixed(1);
 document.getElementById('mdDV').textContent=d.toFixed(2);
 const cv=document.getElementById('mdCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=70,L=520;
 function msg(t){return Math.sin(2*Math.PI*fm*t);}
 function row(y,label,color,fn,env){
  ctx.fillStyle=color;ctx.font='bold 12.5px sans-serif';ctx.textAlign='right';
  ctx.fillText(label,ox-10,y+4);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=520;i++){const t=i/520;const x=ox+L*t;const v=fn(t);
   if(i===0)ctx.moveTo(x,y-v);else ctx.lineTo(x,y-v);}
  ctx.stroke();
  if(env){ctx.strokeStyle=color;ctx.globalAlpha=0.45;ctx.setLineDash([4,3]);ctx.lineWidth=1;ctx.beginPath();
   for(let i=0;i<=520;i++){const t=i/520;const x=ox+L*t;const v=env(t);
    if(i===0)ctx.moveTo(x,y-v);else ctx.lineTo(x,y-v);}
   ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.lineWidth=2;}
 }
 row(58,'訊息','#059669',t=>24*msg(t));
 row(150,'AM 調幅','#0891b2',t=>18*(1+d*msg(t))*Math.sin(2*Math.PI*fc*t),t=>18*(1+d*msg(t)));
 let ph=0;const N=520;
 const fmPts=[];
 for(let i=0;i<=N;i++){const t=i/N;ph+=2*Math.PI*(fc+fc*0.5*d*msg(t))/N;fmPts.push(26*Math.sin(ph));}
 ctx.fillStyle='#e11d48';ctx.font='bold 12.5px sans-serif';ctx.textAlign='right';ctx.fillText('FM 調頻',ox-10,254);
 ctx.strokeStyle='#e11d48';ctx.lineWidth=2;ctx.beginPath();
 fmPts.forEach((v,i)=>{const x=ox+L*i/N;if(i===0)ctx.moveTo(x,250-v);else ctx.lineTo(x,250-v);});
 ctx.stroke();
 ctx.fillStyle='#4d6b76';ctx.font='11.5px sans-serif';ctx.textAlign='left';
 ctx.fillText('高度隨訊息變（頻率不變）',ox+L-190,124);
 ctx.fillText('疏密隨訊息變（高度不變）',ox+L-190,300);
 const bwAM=2*fm, bwFM=2*(fc*0.5*d+fm);
 document.getElementById('mdNote').innerHTML='在此設定下，AM 佔用的頻寬約為訊息頻率的 2 倍（<b>'+bwAM.toFixed(1)+'</b> 相對單位），FM 約 <b>'+bwFM.toFixed(1)+'</b>。'+
  '<b>調制深度拉到 0 會看到載波變回一條純淨的正弦波</b>——它本身不帶任何資訊，只是「一張空白信紙」。'+
  '<br><b>關鍵觀念</b>：FM 不是用頻率本身傳資訊，而是用<b>頻率的微小變化</b>傳資訊，所以高頻載波的發射優勢被完整保留。也注意 FM 的頻寬明顯比 AM 寬——這就是「調制必然佔用一段頻率」的由來。';
}

/* ---- 3. 頻譜分配與干擾 ---- */
function toolSpec(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>頻段總寬度 <span id="spTV">20</span> MHz<input id="spT" type="range" min="5" max="100" value="20"></label>'+
  '<label>每台信道帶寬 <span id="spBV">200</span> kHz<input id="spB" type="range" min="50" max="1000" value="200" step="50"></label>'+
  '<label>相鄰間隔 <span id="spGV">200</span> kHz<input id="spG" type="range" min="0" max="1000" value="200" step="50"></label>'+
  '</div><canvas id="spCanvas" width="640" height="260"></canvas>'+
  '<div class="d" id="spNote"></div></div>';
 ['spT','spB','spG'].forEach(id=>document.getElementById(id).oninput=drawSpec);
 drawSpec();
}
function drawSpec(){
 const T=+document.getElementById('spT').value;
 const B=+document.getElementById('spB').value;
 const G=+document.getElementById('spG').value;
 document.getElementById('spTV').textContent=T;
 document.getElementById('spBV').textContent=B;
 document.getElementById('spGV').textContent=G;
 const step=Math.max(B,G)/1000;
 const n=Math.max(Math.floor(T/step),0);
 const overlap=G<B;
 const cv=document.getElementById('spCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=40,W=560,y=110;
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(ox,y+56);ctx.lineTo(ox+W,y+56);ctx.stroke();
 const show=Math.min(n,60);
 for(let i=0;i<show;i++){
  const cx=ox+W*(i*step+step/2)/T;
  const halfw=Math.max(W*(B/1000)/T/2,1.2);
  const col=overlap?'#e11d48':'#0891b2';
  ctx.fillStyle=col;ctx.globalAlpha=overlap?0.42:0.62;
  ctx.beginPath();
  ctx.moveTo(cx-halfw,y+56);
  ctx.quadraticCurveTo(cx,y-6,cx+halfw,y+56);
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 }
 ctx.fillStyle='#4d6b76';ctx.font='11.5px sans-serif';ctx.textAlign='center';
 ctx.fillText('頻率 →',ox+W-30,y+76);
 ctx.textAlign='left';ctx.fillText('0',ox,y+76);
 ctx.textAlign='right';ctx.fillText(T+' MHz',ox+W,y+76);
 ctx.fillStyle='#123039';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
 ctx.fillText('可容納電台數：'+n+(n>60?'（僅顯示前 60 個）':''),ox,y+118);
 let msg='總寬度 '+T+' MHz ÷ 間隔 '+Math.max(B,G)+' kHz ⟹ 約可容納 <b>'+n+'</b> 個電台。';
 if(overlap)msg+=' <b style="color:#e11d48">目前間隔小於信道帶寬，相鄰電台會重疊互相干擾</b>——這就是老式收音機調台時聽到兩個電台同時出聲的情況。';
 else msg+=' 目前間隔 ≥ 信道帶寬，不會互相干擾。';
 msg+='<br><b>試試看</b>：把總寬度設 20MHz、帶寬與間隔都設 200kHz，正好對應真實 FM 廣播的 88–108MHz 配置，答案是 100 個電台——這就是為什麼頻譜是不可再生的稀缺資源。';
 document.getElementById('spNote').innerHTML=msg;
}

/* ---- 4. 蜂窩頻率複用 ---- */
function toolCell(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>小區半徑 <span id="clRV">40</span> px<input id="clR" type="range" min="18" max="70" value="40"></label>'+
  '<label>複用群大小 N = <span id="clNV">7</span><input id="clN" type="range" min="3" max="12" value="7"></label>'+
  '<label>總可用信道數 <span id="clCV">420</span><input id="clC" type="range" min="60" max="1200" value="420" step="30"></label>'+
  '</div><canvas id="clCanvas" width="640" height="330"></canvas>'+
  '<div class="d" id="clNote"></div></div>';
 ['clR','clN','clC'].forEach(id=>document.getElementById(id).oninput=drawCell);
 drawCell();
}
function drawCell(){
 const R=+document.getElementById('clR').value;
 const NG=+document.getElementById('clN').value;
 const C=+document.getElementById('clC').value;
 document.getElementById('clRV').textContent=R;
 document.getElementById('clNV').textContent=NG;
 document.getElementById('clCV').textContent=C;
 const cv=document.getElementById('clCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const cols=['#0891b2','#059669','#d97706','#7c3aed','#e11d48','#0ea5a4','#6366f1','#f59e0b','#10b981','#8b5cf6','#ef4444','#14b8a6'];
 let cells=0;
 const rows=Math.ceil(300/(R*1.5))+2, colsN=Math.ceil(600/(R*1.732))+2;
 for(let r=-1;r<rows;r++){
  for(let q=-1;q<colsN;q++){
   const cx=40+q*R*1.732+(r%2?R*0.866:0);
   const cy=40+r*R*1.5;
   if(cx<10||cx>620||cy<20||cy>290)continue;
   cells++;
   const g=((q*2+r*3)%NG+NG)%NG;
   ctx.beginPath();
   for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=cx+R*Math.cos(a),py=cy+R*Math.sin(a);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.closePath();
   ctx.fillStyle=cols[g%cols.length];ctx.globalAlpha=0.30;ctx.fill();ctx.globalAlpha=1;
   ctx.strokeStyle=cols[g%cols.length];ctx.lineWidth=1.4;ctx.stroke();
   if(R>26){ctx.fillStyle=cols[g%cols.length];ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('F'+(g+1),cx,cy+4);}
  }
 }
 const perCell=Math.floor(C/NG);
 const total=perCell*cells;
 ctx.fillStyle='#123039';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
 ctx.fillText('小區數 '+cells+'　每小區信道 '+perCell+'　總容量 '+total,20,315);
 document.getElementById('clNote').innerHTML='複用群 N='+NG+' 表示每 '+NG+' 個小區用完一輪頻段再重複。'+
  '每小區可用 '+C+'÷'+NG+' = <b>'+perCell+'</b> 個信道，畫面中 '+cells+' 個小區合計 <b>'+total+'</b> 個同時通話。'+
  '<br><b>試試看</b>：把小區半徑調小（等同微蜂窩），會看到小區數暴增、<b>總容量大幅上升——而且完全沒有新增任何頻譜</b>。這就是蜂窩系統的核心智慧。反之把 N 調大，干擾更安全但每小區信道變少，是可靠性與容量的取捨。';
}

/* ---- 5. 香農容量 ---- */
function toolShannon(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>頻寬 B = <span id="shBV">20</span> MHz<input id="shB" type="range" min="1" max="600" value="20"></label>'+
  '<label>訊雜比 S/N = <span id="shSV">20</span> dB<input id="shS" type="range" min="0" max="40" value="20"></label>'+
  '</div><canvas id="shCanvas" width="640" height="300"></canvas>'+
  '<div class="d" id="shNote"></div></div>';
 ['shB','shS'].forEach(id=>document.getElementById(id).oninput=drawShannon);
 drawShannon();
}
function cap(Bmhz,snrdb){const snr=Math.pow(10,snrdb/10);return Bmhz*Math.log2(1+snr);}
function drawShannon(){
 const B=+document.getElementById('shB').value;
 const S=+document.getElementById('shS').value;
 document.getElementById('shBV').textContent=B;
 document.getElementById('shSV').textContent=S;
 const C=cap(B,S);
 const cv=document.getElementById('shCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=70,oy=230,W=520,H=180;
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+W,oy);ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-H);ctx.stroke();
 const maxB=600, maxC=cap(maxB,40);
 ctx.strokeStyle='#0891b2';ctx.lineWidth=3;ctx.beginPath();
 for(let i=0;i<=200;i++){
  const bb=maxB*i/200, cc=cap(bb,S);
  const x=ox+W*bb/maxB, y=oy-H*Math.min(cc/maxC,1);
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();
 const px=ox+W*B/maxB, py=oy-H*Math.min(C/maxC,1);
 ctx.fillStyle='#e11d48';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#e11d48';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,oy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#4d6b76';ctx.font='12px sans-serif';ctx.textAlign='center';
 ctx.fillText('頻寬 B (MHz) →',ox+W-70,oy+22);
 for(const b of [0,150,300,450,600]){ctx.fillText(b,ox+W*b/maxB,oy+18);}
 ctx.save();ctx.translate(ox-42,oy-H/2);ctx.rotate(-Math.PI/2);ctx.fillText('容量 C (Mbps)',0,0);ctx.restore();
 ctx.fillStyle='#123039';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
 ctx.fillText('C = '+C.toFixed(0)+' Mbps',ox+10,oy-H-4);
 const dB=cap(B*2,S)-C, dS=cap(B,S+6)-C;
 document.getElementById('shNote').innerHTML='在 B='+B+'MHz、S/N='+S+'dB 下，理論容量 <b>'+C.toFixed(0)+' Mbps</b>。'+
  '<br><b>關鍵比較</b>：把<b>頻寬加倍</b>可增加 <b>'+dB.toFixed(0)+' Mbps</b>；把<b>訊雜比提升 6dB</b>（功率變 4 倍）只增加 <b>'+dS.toFixed(0)+' Mbps</b>。'+
  '因為頻寬 B 是線性項、訊雜比在對數裡面，<b>加大頻寬遠比提升功率有效</b>——這正是每一代行動通訊都拼命往更寬頻譜走的根本原因，也因此撞上了頻率的雙刃劍。';
}
