<body>
<header>
  <h1>📶 <span class="em">天線設計</span>知識庫</h1>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8fbccb" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" placeholder="搜尋知識點…（Enter 開啟）" autocomplete="off">
  </div>
  <div class="tabs">
    <button id="tabNotes" class="active">📖 筆記</button>
    <button id="tabGraph">🕸️ 關係圖譜</button>
    <button id="tabDemo">🔬 模擬工具</button>
  </div>

<div class="wrap">
  <aside id="sidebar"></aside>
  <main id="main"></main>
  <div id="graphView"><svg id="graph"></svg><div class="legend" id="legend"></div>
    <div class="hint">拖曳節點 · 點擊開啟筆記 · 移入高亮關聯</div></div>
  <div id="demoView"></div>
</div>
<script>


const CATS={
 "基礎":{name:"輻射的物理基礎",raw:"#0891b2"},
 "電路":{name:"天線的電路面",raw:"#0ea5a4"},
 "基本型":{name:"基本天線類型",raw:"#059669"},
 "孔徑":{name:"孔徑類天線",raw:"#7c3aed"},
 "陣列":{name:"陣列",raw:"#d97706"},
 "系統":{name:"系統與實務",raw:"#e11d48"}
};
function L(id){return '<a class="wl" data-id="'+id+'">'+id+'</a>';}
const NOTES=[
{id:"天線的本質與輻射的起源",ch:"1",en:"Ch.1 · Origin of Radiation",cat:"基礎",html:`<div class="callout"><b>這章的問題：</b>一段導線通電流就會輻射嗎？為什麼傳輸線上跑著大電流卻幾乎不輻射，而一根張開的天線就會？</div>
<h3>天線的角色：阻抗轉換器</h3><p>電路能量被限制在傳輸線導體之間（如 50Ω），自由空間則有自己的波阻抗 η₀=√(μ₀/ε₀)≈377Ω。天線把 50Ω 導波系統的能量轉換成 377Ω 自由空間的波——它同時是阻抗轉換器與場的形狀轉換器。</p>
<h3>輻射的真正條件：電荷必須加速</h3><p>靜止電荷不輻射；等速運動電荷（穩定直流）也不輻射；<b>只有加速的電荷才輻射</b>。直覺圖像：電荷等速時電力線平順跟隨；一旦加速，遠處電力線來不及知道（資訊只能以光速傳播），於是出現一段被迫扭折的電力線，這段扭折以光速向外傳播、帶走能量——這就是輻射。</p>
<div class="formula">輻射 ⟺ ∂I/∂t ≠ 0，或電流沿線變化（有端點、彎折、不連續）</div>
<h3>為什麼傳輸線不輻射，天線會</h3><p>雙導線上兩股電流大小相同方向相反，間距 d≪λ，遠處收到的兩份貢獻相位幾乎相同而方向相反，<b>幾乎完全抵消</b>。把末端兩導體向外扳開（這正是偶極的物理由來），抵消條件被破壞，能量開始洩漏——它變成了天線。<b>輻射多寡取決於反向電流的抵消被破壞得多徹底。</b></p>
<h3>三個關鍵長度尺度</h3><p>L≪λ（電小）：輻射弱、輸入電阻極小、難匹配窄頻；L∼λ/2（諧振）：電流成駐波、阻抗近純電阻、好匹配；L≫λ（孔徑/陣列）：用孔徑場或陣列因子處理。<b>為什麼波長是唯一尺規</b>：決定遠場相消的是相位差 βΔr=(2π/λ)Δr，只有 Δr 相對 λ 的比例有物理意義。</p>
<h3>向量位的捷徑</h3><p>因 ∇·B=0 保證 B=∇×A 存在，解得延遲積分：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>A</mi><mrow><mo>(</mo><mi>r</mi><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><mi>π</mi></mrow></mfrac><mo>)</mo></mrow><mo>∫</mo><mi>J</mi><mrow><mo>(</mo><mi>r</mi><mo>′</mo><mo>)</mo></mrow><mo>·</mo><mfrac><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>jβ</mi><mrow><mo>|</mo><mi>r</mi><mo>−</mo><mi>r</mi><mo>′</mo><mo>|</mo></mrow></mrow></msup></mrow><mrow><mrow><mo>|</mo><mi>r</mi><mo>−</mo><mi>r</mi><mo>′</mo><mo>|</mo></mrow><mi>dV</mi><mo>′</mo></mrow></mfrac></mrow></math></div>
<p>分母 1/|r−r′| 是球面波振幅衰減；分子的指數是<b>延遲相位</b>——電流元的影響要花 |r−r′|/c 才傳到，在頻域表現為相位落後。整個天線分析的核心，就是追蹤各電流元的相位如何相長或相消。</p>
<p>場區怎麼劃分 → ${L("近場與遠場")}；輻射往哪去 → ${L("輻射場型與方向性")}；電路端看到什麼 → ${L("輸入阻抗與匹配")}。</p>`},
{id:"近場與遠場",ch:"2",en:"Ch.2 · Field Regions",cat:"基礎",html:`<div class="callout"><b>這章的問題：</b>2D²/λ 這個著名的遠場距離怎麼推出來？為什麼分子是 D²？為什麼量測天線必須站得夠遠？</div>
<h3>三個場區</h3><p><b>電抗近場</b>（r &lt; 0.62√(D³/λ)）：儲能為主，E 與 H 相位差近 90°，能量來回震盪不真正離開——這是輸入電抗的物理來源。<b>輻射近場/菲涅耳</b>：輻射開始主導但場型仍隨距離改變。<b>遠場/夫朗和斐</b>（r &gt; 2D²/λ）：場型不再隨距離改變，E 與 H 同相且比值 377Ω，波前近似平面波。</p>
<img class="diagram" src="data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNzYwIDM2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmb250LWZhbWlseT0iJ1BpbmdGYW5nIFRDJywnTWljcm9zb2Z0IEpoZW5nSGVpJywnSGVsdmV0aWNhIE5ldWUnLHNhbnMtc2VyaWYiPgo8dGV4dCB4PSIzODAuMCIgeT0iMjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxMjMwMzkiPuS4ieWAi+WgtOWNgOiIhyAyRMKyL867IOeahOeUseS+hjwvdGV4dD4KPHBhdGggZD0iTSAxMTAgLTMyMCBBIDUyMCA1MjAgMCAwIDEgMTEwIDcyMCBaIiBmaWxsPSIjZTExZDQ4IiBvcGFjaXR5PSIwLjEwIi8+CjxwYXRoIGQ9Ik0gMTEwIC0zMjAgQSA1MjAgNTIwIDAgMCAxIDExMCA3MjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2UxMWQ0OCIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtZGFzaGFycmF5PSI2IDQiLz4KPHBhdGggZD0iTSAxMTAgLTEzMCBBIDMzMCAzMzAgMCAwIDEgMTEwIDUzMCBaIiBmaWxsPSIjZDk3NzA2IiBvcGFjaXR5PSIwLjEwIi8+CjxwYXRoIGQ9Ik0gMTEwIC0xMzAgQSAzMzAgMzMwIDAgMCAxIDExMCA1MzAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2Q5NzcwNiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtZGFzaGFycmF5PSI2IDQiLz4KPHBhdGggZD0iTSAxMTAgMzAgQSAxNzAgMTcwIDAgMCAxIDExMCAzNzAgWiIgZmlsbD0iIzA4OTFiMiIgb3BhY2l0eT0iMC4xMCIvPgo8cGF0aCBkPSJNIDExMCAzMCBBIDE3MCAxNzAgMCAwIDEgMTEwIDM3MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDg5MWIyIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1kYXNoYXJyYXk9IjYgNCIvPgo8dGV4dCB4PSI2MjIiIHk9Ii0yOTQiIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNlMTFkNDgiPumBoOWgtOWNgCBGcmF1bmhvZmVyPC90ZXh0Pgo8dGV4dCB4PSI0MzIiIHk9Ii0xMDQiIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNkOTc3MDYiPui8u+WwhOi/keWgtCBGcmVzbmVsPC90ZXh0Pgo8dGV4dCB4PSIyNzIiIHk9IjU2IiBmb250LXNpemU9IjEzIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMDg5MWIyIj7pm7vmipfov5HloLQ8L3RleHQ+CjxsaW5lIHgxPSIxMTAiIHkxPSIxNTgiIHgyPSIxMTAiIHkyPSIyNDIiIHN0cm9rZT0iIzEyMzAzOSIgc3Ryb2tlLXdpZHRoPSI2IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KPHRleHQgeD0iOTYiIHk9IjIwNSIgdGV4dC1hbmNob3I9ImVuZCIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzEyMzAzOSI+RDwvdGV4dD4KPGxpbmUgeDE9IjEwMiIgeTE9IjE1OCIgeDI9IjEwMiIgeTI9IjI0MiIgc3Ryb2tlPSIjMTIzMDM5IiBzdHJva2Utd2lkdGg9IjEiLz4KPHRleHQgeD0iMjgwIiB5PSIyMjgiIGZvbnQtc2l6ZT0iMTIiIGZpbGw9IiMw <h3>2D²/λ 的推導——為什麼是 D²</h3><p>天線邊緣點到觀測點的距離比中心多出：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>r</mi><mo>′</mo><mo>=</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mfrac><mi>D</mi><mn>2</mn></mfrac><mo>)</mo></mrow><mn>2</mn></msup></msqrt><mo>=</mo><mi>r</mi><msqrt><mn>1</mn><mo>+</mo><mfrac><mrow><msup><mi>D</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac></msqrt><mo>≈</mo><mi>r</mi><mo>+</mo><mfrac><mrow><msup><mi>D</mi><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>8</mn><mi>r</mi><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>路徑差 Δr = D²/(8r)，相位誤差 Δφ = (2π/λ)·D²/(8r) = πD²/(4λr)。工程約定「最大相位誤差 ≤ π/8（22.5°）」時視為平面波：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mrow><msup><mi>πD</mi><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>4</mn><mi>λr</mi><mo>)</mo></mrow></mfrac><mo>≤</mo><mfrac><mi>π</mi><mn>8</mn></mfrac><mo>⟹</mo><mi>r</mi><mo>≥</mo><mfrac><mrow><mn>2</mn><msup><mi>D</mi><mn>2</mn></msup></mrow><mi>λ</mi></mfrac></mrow></math></div>
<p><b>D 平方來自畢氏定理的二次項；除以 λ 是因為判準是相位而非長度。</b>π/8 不是物理定律而是工程慣例（對應約 0.1dB 增益誤差），嚴格場合用 4D²/λ。</p>
<h3>這個距離有多可怕</h3><p>3m 碟 @12GHz → 720m；30m 電波望遠鏡 @10GHz → <b>60km</b>。大型天線的遠場量測在物理上做不到，這正是近場量測與緊縮場存在的理由，見 ${L("天線量測")}。</p>
<h3>遠場近似怎麼簡化數學</h3><p><b>振幅用零階</b>（1/|r−r′|≈1/r，可提到積分外）、<b>相位用一階</b>（|r−r′|≈r−r̂·r′）。為什麼不對稱：振幅差幾個百分點無傷大雅，相位差 π 就讓相長變相消。代入後：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>A</mi><mo>≈</mo><mrow><mo>(</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>jβr</mi></mrow></msup></mrow><mrow><mn>4</mn><mi>πr</mi></mrow></mfrac><mo>)</mo></mrow><mo>∫</mo><mi>J</mi><mrow><mo>(</mo><mi>r</mi><mo>′</mo><mo>)</mo></mrow><mo>·</mo><msup><mi>e</mi><mrow><mi>jβ</mi><mi>r̂</mi><mo>·</mo><mi>r</mi><mo>′</mo></mrow></msup><mi>dV</mi><mo>′</mo></mrow></math></div>
<p>括號外是與方向無關的球面波因子，<b>積分項只跟方向有關、與距離無關</b>——這就是「遠場場型不隨距離改變」的數學證明。而這個積分正是電流分布的<b>空間傅立葉轉換</b>，此洞見會在 ${L("陣列天線與陣列因子")} 反覆出現。</p>`},
{id:"輻射場型與方向性",ch:"3",en:"Ch.3 · Pattern & Directivity",cat:"基礎",html:`<div class="callout"><b>這章的問題：</b>方向性 D 的定義為什麼要用一個積分？為什麼「方向性高」跟「波束窄」是同一件事？旁瓣能不能消掉？</div>
<h3>輻射強度：為什麼要乘 r²</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>U</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mi>S</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mrow><msup><mi>r</mi><mn>2</mn></msup><msup><mrow><mo>|</mo><mi>E</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>|</mo></mrow><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>2</mn><msub><mi>η</mi><mn>0</mn></msub><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>功率密度 S 本身隨 1/r² 衰減，乘上 r² 正好抵消幾何衰減，剩下純粹的方向資訊——讓 U 成為與距離無關的量。</p>
<h3>場型上的關鍵特徵</h3><p>主瓣、半功率波束寬 HPBW（−3dB）、第一零點波束寬 FNBW、旁瓣、旁瓣位準 SLL、前後比 F/B。<b>為什麼用 dB</b>：主瓣與旁瓣常差 100 倍以上，線性刻度看不見旁瓣；且串接運算在 dB 下變加減法。</p>
<p><b>旁瓣為什麼存在</b>：它不是設計失誤，是<b>傅立葉轉換的必然結果</b>。均勻照射孔徑對應 sinc 型場型，而 sinc 天生有 −13.2dB 第一旁瓣。壓低旁瓣必須讓照射邊緣漸弱（錐削），代價是有效孔徑變小、增益下降、主瓣變寬。</p>
<h3>方向性的積分定義</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>D</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mrow><mi>U</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow></mrow><mrow><msub><mi>U</mi><mi>iso</mi></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>πU</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow></mrow><mrow><msub><mi>P</mi><mi>rad</mi></msub></mrow></mfrac></mrow></math></div>
<p>分母為什麼是 P_rad/4π：等向性天線把總功率均勻攤在 4π 立體角上，每單位立體角拿到 P_rad/4π。而總功率必須把所有方向加總，這就是積分的來源：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>rad</mi></msub><mo>=</mo><mo>∮</mo><mi>U</mi><mi>dΩ</mi><mo>=</mo><mo>∫</mo><mo>∫</mo><mi>U</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mi>sinθ</mi><mi>dθ</mi><mi>dφ</mi></mrow></math></div>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>D</mi><mi>max</mi></msub><mo>=</mo><mfrac><mrow><mn>4</mn><msub><mi>πU</mi><mi>max</mi></msub></mrow><mrow><mo>∮</mo><mi>U</mi><mi>dΩ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>π</mi></mrow><mrow><msub><mi>Ω</mi><mi>A</mi></msub></mrow></mfrac></mrow></math></div>
<h3>為什麼方向性高等於波束窄</h3><p>D=4π/Ω_A 直接說明一切：<b>方向性與波束立體角成反比，唯一的理由是能量守恆</b>——總功率固定，擠進越小的角度範圍，該範圍強度就越高。天線不產生能量，只重新分配能量。由此得實用估算式：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>D</mi><mi>max</mi></msub><mo>≈</mo><mfrac><mn>41253</mn><mrow><mo>(</mo><msub><mi>θ</mi><mi>E</mi></msub><mo>°</mo><mo>×</mo><msub><mi>θ</mi><mi>H</mi></msub><mo>°</mo><mo>)</mo></mrow></mfrac><mtext>　（實務含旁瓣修正用</mtext><mn>26000</mn><mo>–</mo><mn>32000</mn><mtext>）</mtext></mrow></math></div>
<h3>波束寬與孔徑：θ ≈ kλ/D</h3><p>均勻照射圓孔徑 k≈58°，典型錐削 k≈65–70°。<b>為什麼是 λ/D</b>：這是繞射的普適結果，也是傅立葉轉換的尺度反比性質——孔徑越大，角度域場型越窄。結合前式得 D_max ∼ 4πA/λ²，預告了 ${L("增益效率與有效面積")} 的主結果。</p>
<h3>E 面與 H 面</h3><p>E 面含最大輻射方向且平行於 E 向量；H 面與之垂直。半波偶極的 E 面呈 8 字、H 面呈完美圓形——這是偶極的招牌，見 ${L("偶極與單極天線")}。</p>`},
{id:"增益效率與有效面積",ch:"4",en:"Ch.4 · Gain & Effective Aperture",cat:"基礎",html:`<div class="callout"><b>這章的問題：</b>增益跟方向性差在哪？為什麼有效面積是 λ²G/4π——這個 λ² 從哪來，它為什麼意味著頻率越高、同增益的天線越小？</div>
<h3>增益 = 方向性 × 效率</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>G</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>πU</mi></mrow><mrow><msub><mi>P</mi><mi>in</mi></msub></mrow></mfrac><mi>D</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>πU</mi></mrow><mrow><msub><mi>P</mi><mi>rad</mi></msub></mrow></mfrac><mtext>⟹</mtext><mi>G</mi><mo>=</mo><msub><mi>e</mi><mi>cd</mi></msub><mo>·</mo><mi>D</mi></mrow></math></div>
<p>兩者只差在分母：D 用實際輻射出去的功率，G 用輸入的功率。D 是純幾何性質（理論分析的自然產物），G 才是系統工程師在意的（送進 1W 最強方向能收到多少）。</p>
<h3>效率的三層拆解</h3><p><b>失配</b> e_r=1−|Γ|²（功率被反射回去，根本沒進天線）；<b>導體損耗</b> e_c（高頻集膚效應讓等效電阻大增）；<b>介質損耗</b> e_d（基板 tanδ）。總效率 e = (1−|Γ|²)·e_cd。</p>
<p>讀規格書要分清：<b>增益 G</b>（不含失配）vs <b>實現增益 G_re=(1−|Γ|²)G</b>（含失配，這才是系統中真正拿得到的）。</p>
<h3>dBi 與 dBd</h3><p>半波偶極方向性 D=1.64=2.15dBi，故 <b>G_dBi = G_dBd + 2.15</b>。等向性天線物理上不存在但數學基準乾淨；半波偶極做得出來可當實體標準。</p>
<h3>有效面積與孔徑效率</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>received</mi></msub><mo>=</mo><msub><mi>A</mi><mi>e</mi></msub><mo>·</mo><msub><mi>S</mi><mi>incident</mi></msub><msub><mi>η</mi><mi>ap</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>A</mi><mi>e</mi></msub></mrow><mrow><msub><mi>A</mi><mi>p</mi></msub></mrow></mfrac></mrow></math></div>
<p>典型孔徑效率：理想均勻照射 100%、實際拋物面碟 55–70%、喇叭 50–80%。<b>為什麼永遠小於 1</b>：照射錐削、溢波、遮擋、表面誤差，見 ${L("反射面天線")}。</p>
<h3>A_e = λ²G/4π —— λ² 的意義</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>A</mi><mi>e</mi></msub><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><msup><mi>λ</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>π</mi></mrow></mfrac><mo>)</mo></mrow><mo>·</mo><mi>G</mi></mrow></math></div>
<p>可由熱力學論證嚴格導出（兩天線在同溫黑體腔中淨功率交換須為零）。<b>物理意涵</b>：即使增益為 1 的最簡單天線，也有約 λ²/4π 的有效攔截面積——<b>天線能攔截的不是物理尺寸覆蓋的面積，而是與波長平方成比例的區域</b>。這解釋了為何細如髮絲的半波偶極（物理截面近乎零）仍能有效接收：它的 A_e=0.13λ²，在 FM 頻段（λ≈3m）超過 1 平方公尺。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>G</mi><mo>=</mo><mfrac><mrow><mn>4</mn><msub><mi>πA</mi><mi>e</mi></msub></mrow><mrow><msup><mi>λ</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><msub><mi>η</mi><mi>ap</mi></msub><mo>·</mo><mfrac><mrow><mn>4</mn><msub><mi>πA</mi><mi>p</mi></msub></mrow><mrow><msup><mi>λ</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><msub><mi>η</mi><mi>ap</mi></msub><mo>·</mo><msup><mrow><mo>(</mo><mfrac><mrow><msub><mi>πD</mi><mi>ap</mi></msub></mrow><mi>λ</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup></mrow></math></div>
<p><b>這條式子是所有高增益天線設計的出發點</b>，它說明兩件事：固定尺寸，增益隨頻率<b>平方</b>上升（同樣的碟在 30GHz 的增益是 3GHz 的 100 倍，+20dB，這正是衛星通訊與毫米波往高頻走的原因）；固定增益需求，天線尺寸隨頻率反比縮小（低頻天線註定龐大）。</p>`},
{id:"輸入阻抗與匹配",ch:"5",en:"Ch.5 · Input Impedance",cat:"電路",html:`<div class="callout"><b>這章的問題：</b>為什麼「輻射」可以被寫成一個電阻？S₁₁、VSWR、反射係數怎麼換算，−10dB 這個門檻怎麼來的？</div>
<h3>輻射電阻：把能量跑掉寫成電阻</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>Z</mi><mi>in</mi></msub><mo>=</mo><mrow><mo>(</mo><msub><mi>R</mi><mi>r</mi></msub><mo>+</mo><msub><mi>R</mi><mi>L</mi></msub><mo>)</mo></mrow><mo>+</mo><msub><mi>jX</mi><mi>in</mi></msub></mrow></math></div>
<p><b>為什麼輻射能用電阻表示</b>：電阻的定義就是「消耗有功功率的元件」。對電路而言能量進去出不來就是被消耗了——<b>它不在乎能量是變成熱還是輻射到太空去</b>，兩者都表現為與電流同相的電壓降，完全不可區分。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>rad</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mrow><mo>|</mo><msub><mi>I</mi><mn>0</mn></msub><mo>|</mo></mrow><mn>2</mn></msup><msub><mi>R</mi><mi>r</mi></msub><mo>⟹</mo><msub><mi>R</mi><mi>r</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>P</mi><mi>rad</mi></msub></mrow><mrow><msup><mrow><mo>|</mo><msub><mi>I</mi><mn>0</mn></msub><mo>|</mo></mrow><mn>2</mn></msup></mrow></mfrac><msub><mi>e</mi><mi>cd</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mi>r</mi></msub></mrow><mrow><mo>(</mo><msub><mi>R</mi><mi>r</mi></msub><mo>+</mo><msub><mi>R</mi><mi>L</mi></msub><mo>)</mo></mrow></mfrac></mrow></math></div>
<p><b>這解釋了電小天線為何效率差</b>：半波偶極 R_r≈73Ω，但 λ/10 短偶極只剩約 2Ω，λ/50 更掉到 0.08Ω 量級，而 R_L 由金屬損耗決定不會跟著變小。當 R_r 掉到與 R_L 同級，效率就崩了——這是手機與 IoT 小天線的根本困境。</p>
<h3>輸入電抗：近場儲能的化身</h3><p>X&gt;0（電感性，比諧振長）、X&lt;0（電容性，比諧振短）、X=0（諧振，電場與磁場儲能平衡）。<b>諧振為何重要</b>：只有 X=0 時天線是純電阻，才能用實數阻抗直接匹配、不需匹配網路。</p>
<h3>反射係數的推導</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>Γ</mi><mo>=</mo><mfrac><mrow><mo>(</mo><msub><mi>Z</mi><mi>in</mi></msub><mo>−</mo><msub><mi>Z</mi><mn>0</mn></msub><mo>)</mo></mrow><mrow><mo>(</mo><msub><mi>Z</mi><mi>in</mi></msub><mo>+</mo><msub><mi>Z</mi><mn>0</mn></msub><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>交界處電壓與電流必須同時連續，而線上 V⁺/I⁺=Z₀、V⁻/I⁻=−Z₀（反向傳播故負號），聯立解出 V⁻/V⁺ 即得。分子說明「差多少決定反射多少」。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mrow><mo>|</mo><msub><mi>S</mi><mn>11</mn></msub><mo>|</mo></mrow><mi>dB</mi></msub><mo>=</mo><mn>20</mn><mi>log</mi><mrow><mo>|</mo><mi>Γ</mi><mo>|</mo></mrow><mi>VSWR</mi><mo>=</mo><mfrac><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mrow><mo>|</mo><mi>Γ</mi><mo>|</mo></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mn>1</mn><mo>−</mo><mrow><mo>|</mo><mi>Γ</mi><mo>|</mo></mrow><mo>)</mo></mrow></mfrac><mtext>　　反射功率</mtext><mtext> = |Γ|²</mtext></mrow></math></div>
<p><b>−10dB 門檻怎麼來</b>：對應 VSWR≈2、反射 10%、傳輸 90%，失配損耗約 0.46dB——這被視為「可接受、再改善的邊際效益開始下降」的實務平衡點。它是工程共識而非物理定律；高功率或精密量測要求 −15dB 以上。天線頻寬的定義通常就綁在這個門檻。</p>
<h3>匹配手法</h3><p>L 型網路（簡單但窄頻）、四分之一波長轉換器 Z_T=√(Z₀Z_L)、短截線調諧、漸變線（頻寬佳但長）、<b>直接改天線結構</b>（貼片內縮饋入、偶極折疊——常是最優雅的做法，不增元件不引損耗）。史密斯圖把這一切變成圖上的幾何路徑規劃。</p>
<h3>巴倫：常被忽略的關鍵</h3><p>偶極是<b>平衡</b>結構，同軸線是<b>不平衡</b>結構。直接相接會有電流沿同軸外皮外側流回，這股電流會輻射，導致場型變形、增益下降、量測隨手握位置改變。<b>這是模擬與實測對不上最常見的原因之一</b>，見 ${L("天線模擬與設計流程")}。</p>`},
{id:"頻寬與品質因數",ch:"6",en:"Ch.6 · Bandwidth & Chu Limit",cat:"電路",html:`<div class="callout"><b>這章的問題：</b>天線做得越小頻寬就越窄——這是工藝限制還是物理定律？Chu 極限說了什麼？</div>
<h3>頻寬有四種，講清楚是哪一種</h3><p><b>阻抗頻寬</b>（S₁₁&lt;−10dB，最常見預設）、<b>場型頻寬</b>、<b>${L("極化")}頻寬</b>（軸比&lt;3dB）、<b>增益頻寬</b>。四者未必重合，而且<b>通常軸比頻寬最窄</b>——圓極化天線常常匹配很好但軸比已經爛掉，設計時它才是真瓶頸。</p>
<h3>Q 與頻寬的倒數關係</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>Q</mi><mo>=</mo><mi>ω</mi><mo>·</mo><mfrac><mrow><msub><mi>W</mi><mi>stored</mi></msub></mrow><mrow><msub><mi>P</mi><mi>dissipated</mi></msub></mrow></mfrac><mi>BW</mi><mo>≈</mo><mfrac><mn>1</mn><mi>Q</mi></mfrac></mrow></math></div>
<p><b>為什麼成反比</b>：Q 高代表儲能遠大於每週期耗散，系統對頻率極度挑剔——只有極接近諧振時電場與磁場儲能才能互相抵消。偏離一點，未抵消的電抗迅速增大、匹配立刻惡化。要拓寬頻寬，就必須降低近場儲能相對輻射功率的比例。</p>
<h3>Chu 極限：頻寬的物理天花板</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>Q</mi><mi>min</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mrow><mo>(</mo><mi>ka</mi><mo>)</mo></mrow><mn>3</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mo>(</mo><mi>ka</mi><mo>)</mo></mrow></mfrac><mtext>，　</mtext><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>λ</mi></mfrac></mrow></math></div>
<p>把天線裝進半徑 a 的假想球內，Q 有不可突破的下限。ka 越小，第一項以<b>三次方</b>暴增：ka=1.0→Q=2（頻寬約 50%）；ka=0.5→Q=10（約 10%）；ka=0.2→Q=130（約 0.8%）；ka=0.1→Q=1010（約 0.1%）。</p>
<p><b>為什麼是三次方</b>：Q 正比於儲能/輻射功率，天線變小時近場儲能相對於能成功輻射的功率急遽惡化——這與「R_r 隨天線縮小而暴跌」是同一件事的兩種描述。體積是三維的，所以指數是 3。<b>這是物理定律不是工藝問題</b>：不管用什麼材料或超材料，只要裝得進那顆球，Q 就不可能更低。</p>
<h3>三個推論——設計上真正能做的事</h3><p><b>(1) 把球填滿。</b>若天線只用了球內一小部分（如一根細線），實際 Q 遠高於下限。把導體撐開填滿可用體積（球面螺旋、立體摺疊）能逼近理論極限——<b>小天線設計的核心不是變小，而是把既有體積用好用滿。</b></p>
<p><b>(2) 犧牲效率換頻寬。</b>加入損耗會降 Q 拓寬頻寬，但那是拿效率換的假頻寬。<b>看到超小天線標榜寬頻，要先問效率。</b></p>
<p><b>(3) 多諧振。</b>用相鄰諧振點疊出較寬範圍。但 Bode-Fano 極限規定匹配-頻寬乘積有上限——可以重新分配，不能無中生有。</p>
<h3>寬頻天線為什麼寬頻</h3><p><b>角度決定原理</b>：若結構完全由角度定義、不含特徵長度（等角螺旋、雙錐），縮放頻率等同縮放結構，特性與頻率無關。<b>自相似/對數週期</b>：結構按固定比例重複，每個頻率有對應的作用區在輻射。<b>兩者的共同代價都是體積</b>——想要寬頻就得付出體積，見 ${L("行波與寬頻天線")}。</p>`},
{id:"極化",ch:"7",en:"Ch.7 · Polarization",cat:"電路",html:`<div class="callout"><b>這章的問題：</b>為什麼會有「圓極化」？軸比 3dB 代表什麼？為什麼衛星愛用圓極化而地面多用線極化？</div>
<h3>定義：追蹤電場向量的軌跡</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>E</mi><mo>=</mo><mi>x̂</mi><mo>·</mo><msub><mi>E</mi><mi>x</mi></msub><mo>·</mo><mi>cos</mi><mrow><mo>(</mo><mi>ωt</mi><mo>)</mo></mrow><mo>+</mo><mi>ŷ</mi><mo>·</mo><msub><mi>E</mi><mi>y</mi></msub><mo>·</mo><mi>cos</mi><mrow><mo>(</mo><mi>ωt</mi><mo>+</mo><mi>δ</mi><mo>)</mo></mrow></mrow></math></div>

<p><b>為什麼 90° 加等振幅會轉圈</b>：這正是 x=cosωt, y=sinωt 描述圓的原因——一個分量爬升時另一個歸零，合力方向平順轉動而長度不變。</p>
<h3>旋向與經典陷阱</h3><p>IEEE 定義：拇指指向傳播方向，四指彎曲方向即電場旋轉方向。<b>但光學界與部分天文文獻採相反約定</b>，同一個波在不同文獻中旋向相反——旋向搞反的後果是完全收不到訊號（理論上無限大損耗，實際約 −20~−30dB）。這個「幾乎完全隔離」也是優點：RHCP 與 LHCP 可各傳一路獨立訊號，頻譜效率加倍。</p>
<h3>軸比：圓極化有多圓</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mtext>AR = </mtext><mtext>長軸</mtext><mtext>/</mtext><mtext>短軸，　</mtext><msub><mi>AR</mi><mi>dB</mi></msub><mo>=</mo><mn>20</mn><mi>log</mi><mrow><mo>(</mo><mi>AR</mi><mo>)</mo></mrow><mtext>　　業界門檻</mtext><mi>AR</mi><mo>&lt;</mo><mn>3</mn><mi>dB</mi></mrow></math></div>
<p><b>3dB 怎麼來</b>：對應長短軸比約 1.41，此時與完美圓極化對接的失配損耗約 0.5dB。<b>為什麼軸比頻寬最窄</b>：維持圓極化必須<b>同時</b>滿足「等振幅」與「相位差恰 90°」兩個條件，頻率一偏兩者同時劣化；阻抗匹配只要滿足一個條件，自然容易得多。</p>
<h3>三種產生手法</h3><p><b>雙饋入+90°混合器</b>：最乾淨、軸比頻寬最寬，代價是額外饋入網路。<b>單饋入+簡併模微擾</b>（切角或長方形貼片）：讓兩正交模分裂，一模電感性一模電容性恰成 90°；最省成本但軸比頻寬僅 1–2%。<b>螺旋天線</b>：幾何本身就帶電流轉圈，天然圓極化且寬頻，代價是體積——又一次驗證體積換頻寬。</p>
<h3>極化失配損失因子</h3><div class="formula">PLF = |ρ̂_tx · ρ̂*_rx|²</div>
<p>垂直對垂直 0dB；垂直對 45° 傾斜 <b>3dB</b>；垂直對水平 <b>∞</b>；圓對任意線極化 <b>固定 3dB</b>；RHCP 對 LHCP <b>∞</b>。</p>
<h3>為什麼衛星用圓極化</h3><p><b>(1) 接收端姿態不確定</b>：線極化在某些角度會完全失聯，圓極化對任意線極化都是固定 3dB——<b>用穩定的 3dB 代價，買斷「完全失聯」的風險</b>。<b>(2) 法拉第旋轉</b>：電離層讓線極化面旋轉，量值隨時間與太陽活動變化無法預補償，圓極化完全免疫。<b>(3) 抗多重路徑</b>：反射會讓旋向反轉，只收 RHCP 等於天然抑制一次反射。</p>
<p>地面則因結構簡單、姿態固定可拿滿 0dB、且能用水平/垂直雙極化做 MIMO 容量加倍，故多用線極化。</p>`},
{id:"偶極與單極天線",ch:"8",en:"Ch.8 · Dipole & Monopole",cat:"基本型",html:`<div class="callout"><b>這章的問題：</b>半波偶極的輸入電阻為什麼恰好是 73Ω？方向性 1.64 怎麼算的？為什麼實際要剪短到 0.47λ？</div>
<h3>赫茲偶極：所有分析的起點</h3><p>L≪λ 且電流均勻，相位差可忽略，積分變成單純相乘：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>E</mi><mi>θ</mi></msub><mo>=</mo><msub><mi>jη</mi><mn>0</mn></msub><mo>·</mo><mfrac><mrow><msub><mi>βI</mi><mn>0</mn></msub><mi>L</mi></mrow><mrow><mo>(</mo><mn>4</mn><mi>πr</mi><mo>)</mo></mrow></mfrac><mo>·</mo><mi>sinθ</mi><mo>·</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>jβr</mi></mrow></msup><msub><mi>H</mi><mi>φ</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>E</mi><mi>θ</mi></msub></mrow><mrow><msub><mi>η</mi><mn>0</mn></msub></mrow></mfrac></mrow></math></div>
<p><b>sinθ 因子</b>就是經典甜甜圈場型。<b>為什麼兩端為零</b>：沿導線軸看去，看到的是電荷迎面/背向運動，橫向電場投影為零——輻射場是橫波，沒有縱向分量。<b>E/H=η₀</b> 正是遠場判準之一。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>R</mi><mi>r</mi></msub><mo>=</mo><mn>80</mn><msup><mi>π</mi><mn>2</mn></msup><msup><mrow><mo>(</mo><mfrac><mi>L</mi><mi>λ</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>≈</mo><mn>790</mn><msup><mrow><mo>(</mo><mfrac><mi>L</mi><mi>λ</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mi>Ω</mi></mrow></math></div>
<p><b>這個平方關係是所有小天線困境的源頭</b>：L=λ/10 時 R_r≈7.9Ω，L=λ/100 只剩 0.079Ω——掉到與導體損耗同級，效率崩潰。</p>
<h3>半波偶極：電流不再均勻</h3><p>兩端電流必須為零（電荷無處可去），中間饋入點最大，形成正弦駐波 I(z)=I₀sin[β(L/2−|z|)]。代入遠場積分：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>F</mi><mrow><mo>(</mo><mi>θ</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mrow><mi>cos</mi><mrow><mo>(</mo><mrow><mo>(</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mo>)</mo></mrow><mi>cosθ</mi><mo>)</mo></mrow></mrow><mi>sinθ</mi></mfrac></mrow></math></div>

<p>實際場型與 sinθ 很接近，只是稍「瘦」——HPBW 78°（vs 赫茲偶極 90°），這個瘦一點正是方向性從 1.5 升到 1.64 的原因。</p>
<h3>73Ω 是怎麼來的</h3><p>代入輻射功率積分，此積分無初等封閉解，需用餘弦積分函數表示，數值約 1.2188：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>R</mi><mi>r</mi></msub><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><msub><mi>η</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><mi>π</mi></mrow></mfrac><mo>)</mo></mrow><mo>×</mo><mn>1.2188</mn><mo>=</mo><mrow><mo>(</mo><mfrac><mn>377</mn><mrow><mn>4</mn><mi>π</mi></mrow></mfrac><mo>)</mo></mrow><mo>×</mo><mn>1.2188</mn><mo>≈</mo><mn>73.1</mn><mi>Ω</mi></mrow></math></div>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>D</mi><mo>=</mo><mfrac><mn>4</mn><mn>1.2188</mn></mfrac><mo>≈</mo><mn>1.64</mn><mo>=</mo><mn>2.15</mn><mi>dBi</mi><msub><mi>Z</mi><mi>in</mi></msub><mo>≈</mo><mn>73</mn><mo>+</mo><mi>j</mi><mn>42.5</mn><mi>Ω</mi></mrow></math></div>
<p><b>所以 73Ω 不是巧合也不是量出來的經驗值，而是一個特殊函數的數值</b>，完全由「半波長正弦電流分布」這個幾何條件決定。這也是 dBd 與 dBi 相差 2.15 的由來。</p>
<h3>為什麼要剪短到 0.47λ</h3><p>λ/2 時有 +j42.5Ω 殘留電感，不是諧振。剪短可引入電容性電抗抵消它，實務約 0.47–0.48λ。縮短量還取決於<b>導線粗細</b>：越粗端點電容效應越強、縮更多，且<b>頻寬更寬</b>（更大體積=更低 Q，完全符合 Chu 極限）。諧振後 Z_in≈70Ω，接 75Ω 幾乎完美（VSWR≈1.07），接 50Ω 也有 −15dB——<b>這就是半波偶極能直接接標準同軸線的原因</b>。</p>
<h3>單極與鏡像原理</h3><p>鏡像原理：導體板上方的電流源，其場等效於原電流加鏡像電流。故 λ/4 單極在地板上方的場，與 λ/2 偶極上半部完全相同。由此：場型同偶極上半球、<b>輻射功率減半</b>、饋入電流不變 ⟹ <b>R_r 減半</b>（Z_in≈36.5+j21Ω）、<b>方向性加倍</b>（3.28 = 5.15dBi，同樣功率只往半個空間送）。</p>
<p><b>真實地板不是無限大</b>——這是模擬與實測差異的主要來源。地板半徑小於約 λ/4 時場型上翹、阻抗改變。手機天線就是典型案例：實際上是機殼地平面在輻射。</p>
<h3>折疊偶極：4 倍阻抗</h3><p>兩根平行導線電流同相等大，總輻射電流變兩倍→功率 4 倍；但饋入端電流只有一半（分給兩支）。R_r=2P/|I|² 於是變 <b>4 倍 ≈ 292Ω</b>。折疊結構等效導體更粗，<b>頻寬明顯優於單根</b>，也是 ${L("行波與寬頻天線")} 中八木天線最常用的驅動單元。</p>`},
{id:"迴圈天線",ch:"9",en:"Ch.9 · Loop Antennas",cat:"基本型",html:`<div class="callout"><b>這章的問題：</b>為什麼小迴圈被稱為「磁偶極」？它的輻射電阻為何衰減得比電偶極更慘？既然效率這麼差，為什麼 NFC、RFID、收音機全在用它？</div>
<h3>兩種完全不同的迴圈</h3><p><b>電小迴圈</b>（C&lt;λ/10）：電流沿圈均勻同相，等同磁偶極。<b>諧振迴圈</b>（C≈λ）：電流成駐波，場型最大值轉到<b>垂直於圈面</b>的方向（跟小迴圈相反！），R_r≈100Ω，效率良好。兩者常被混為一談但物理行為幾乎相反。</p>
<h3>為什麼是磁偶極——對偶性</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>E</mi><mi>φ</mi></msub><mo>=</mo><msub><mi>η</mi><mn>0</mn></msub><mo>·</mo><mfrac><mrow><msup><mi>β</mi><mn>2</mn></msup><mrow><mo>(</mo><mi>IA</mi><mo>)</mo></mrow></mrow><mrow><mo>(</mo><mn>4</mn><mi>πr</mi><mo>)</mo></mrow></mfrac><mo>·</mo><mi>sinθ</mi><mo>·</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>jβr</mi></mrow></msup></mrow></math></div>
<p>場型與電偶極<b>完全相同</b>（都是 sinθ），但 <b>E 與 H 角色對調</b>：電偶極的遠場是 E_θ/H_φ、近場以電場為主；小迴圈是 E_φ/H_θ、<b>近場以磁場為主</b>。這就是馬克士威方程的<b>對偶性</b>——方程在 E↔H、ε↔μ 代換下形式不變，解出電偶極即可直接「翻譯」得到磁偶極，不必重算。</p>
<p><b>場型雖同，零點方向卻不同</b>：小迴圈在<b>圈面法線方向</b>輻射為零、圈面內最強（θ 從法線量起，sinθ 在 θ=0 為零）。</p>
<h3>輻射電阻：比電偶極更慘</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>R</mi><mi>r</mi></msub><mo>≈</mo><mn>31171</mn><mo>·</mo><msup><mrow><mo>(</mo><mfrac><mi>A</mi><mrow><msup><mi>λ</mi><mn>2</mn></msup></mrow></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mi>Ω</mi><mtext>（單匝）</mtext></mrow></math></div>
<p>直徑 λ/20 的圓迴圈，R_r 僅約 0.12Ω。<b>為什麼衰減更快</b>：電偶極的 R_r∝(L/λ)² 是尺寸二次方；小迴圈的 R_r∝(A/λ²)²，而面積本身已是尺寸平方，所以整體是尺寸的<b>四次方</b>——縮小一半，R_r 掉到 1/16。</p>
<p><b>改善手段：多匝。</b>R_r 隨 N² 成長，但損耗電阻只隨 N 線性增加，故效率仍隨 N 改善——這是收音機鐵氧體棒繞上百匝的原因。<b>磁芯</b>則讓等效磁矩放大 μ_eff 倍、R_r 放大 μ_eff² 倍，代價是磁損耗與飽和限制。</p>
<h3>既然效率差，為什麼常用</h3><p>關鍵是<b>很多應用根本不在遠場工作，而是刻意利用近場</b>。</p>
<p><b>NFC/RFID（13.56MHz）</b>：λ≈22m，距離只有幾公分——徹底的電抗近場區，機制是<b>變壓器式磁耦合</b>而非輻射。此時「輻射電阻極小」反而是優點：能量不浪費在輻射出去，而留在近場與卡片耦合。<b>設計目標是最大化磁通耦合，不是最大化增益。</b></p>
<p><b>AM 收音機</b>：λ 達數百公尺，任何塞得進外殼的天線都是電小天線。此時環境<b>人為雜訊以電場耦合為主</b>，而磁偶極對電場不敏感 → 天生抗雜訊；且小迴圈的<b>深零點</b>極銳利，轉動收音機就能把干擾台轉掉——這正是測向的經典原理。</p>
<p><b>環境穩健性</b>：人體、桌面、金屬對電場擾動大、對磁場擾動小，這是 NFC 線圈能貼在電池上仍運作的原因。</p>
<h3>設計陷阱</h3><p>Q 極高（可達數百至數千），對環境極度敏感（手一靠近就失諧），且<b>迴圈上循環電流極大，電容器兩端可出現數千伏高壓</b>，選件須注意耐壓。<b>導體損耗是效率殺手</b>：R_r 只有零點幾歐姆，集膚電阻同量級就吃掉一半功率——因此高效率磁性迴圈都用<b>粗銅管</b>而非細線。</p>`},
{id:"微帶貼片天線",ch:"10",en:"Ch.10 · Microstrip Patch",cat:"基本型",html:`<div class="callout"><b>這章的問題：</b>貼片就是一塊金屬片，輻射到底從哪發生？為什麼長度取 λg/2 卻又要再減掉一段？為什麼頻寬只有 2–5%？</div>
<h3>為什麼這麼受歡迎</h3><p>可用 PCB 製程直接做（成本極低、一致性好）、低姿態可貼合機殼、極易組成陣列（饋入網路印在同一塊板上）。代價是頻寬窄、效率中等、功率容量低。</p>
<h3>輻射從哪裡來——關鍵在邊緣而非面</h3><p>這是最反直覺也最重要的一點。貼片與接地面形成微帶諧振腔，腔內主要是垂直的 E_z。<b>貼片上的電流與接地面鏡像電流方向相反、距離只有基板厚度 h≪λ——回想傳輸線不輻射的論證，這對反向電流的遠場幾乎完全相消。</b></p>
<p>輻射其實來自<b>兩條開路邊的邊緣場</b>。在邊緣，電場彎曲繞到接地面，這段彎曲有一個<b>平行於基板的分量</b>，且兩條邊的該分量<b>同向</b>（腔內場在兩端反相，邊緣彎曲方向也相反，兩個負號抵消）。故貼片可等效為<b>兩條相距 λg/2、同相激發的等效磁流細縫</b>——這解釋了為何場型最大值在正上方（兩細縫同相，正上方路徑差為零），以及為何長度取半波長。</p>
<h3>尺寸設計與那個要減掉的 2ΔL</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>W</mi><mo>=</mo><mrow><mo>(</mo><mfrac><mi>c</mi><mrow><mn>2</mn><msub><mi>f</mi><mn>0</mn></msub></mrow></mfrac><mo>)</mo></mrow><mo>·</mo><msqrt><mfrac><mn>2</mn><mrow><mo>(</mo><msub><mi>ε</mi><mi>r</mi></msub><mo>+</mo><mn>1</mn><mo>)</mo></mrow></mfrac></msqrt></mrow></math></div>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>ε</mi><mi>eff</mi></msub><mo>=</mo><mfrac><mrow><mo>(</mo><msub><mi>ε</mi><mi>r</mi></msub><mo>+</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac><mo>+</mo><mrow><mo>(</mo><mfrac><mrow><mo>(</mo><msub><mi>ε</mi><mi>r</mi></msub><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac><mo>)</mo></mrow><mo>·</mo><msup><mrow><mo>[</mo><mn>1</mn><mo>+</mo><mfrac><mrow><mn>12</mn><mi>h</mi></mrow><mi>W</mi></mfrac><mo>]</mo></mrow><mrow><mfrac><mrow><mo>−</mo><mn>1</mn></mrow><mn>2</mn></mfrac></mrow></msup></mrow></math></div>
<p>諧振要求電長度 λg/2，但<b>邊緣場讓貼片電氣上比實體長</b>，等效於兩端各多出 ΔL，故實際長度必須扣掉：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>L</mi><mo>=</mo><mfrac><mi>c</mi><mrow><mo>(</mo><mn>2</mn><msub><mi>f</mi><mn>0</mn></msub><msqrt><msub><mi>ε</mi><mi>eff</mi></msub></msqrt><mo>)</mo></mrow></mfrac><mo>−</mo><mn>2</mn><mi>ΔL</mi></mrow></math></div>
<p><b>為什麼要理解而不只是套公式</b>：ΔL 正比於基板厚度 h，而 h 同時決定頻寬。所以「想要頻寬→加厚基板→修正量變大→必須重算」，這幾個參數是連動的。</p>
<h3>為什麼頻寬只有 2–5%</h3><p>貼片本質是高 Q 諧振腔——腔內儲能遠大於從兩條窄邊緣漏出的輻射功率。BW ∝ (h/λ)·(1/√ε_r)，給出兩個方向：</p>
<p><b>(1) 加厚基板</b>：最直接，但 h 超過約 0.02λ 後饋入探針電感顯著、難匹配，且會激發<b>表面波</b>造成效率下降與場型畸變。<b>(2) 降低 ε_r</b>：場更多留在空氣中、邊緣場更強、輻射更有效，代價是<b>尺寸變大</b>。所以高效能貼片用泡沫或空氣基板，小型化貼片用高 ε_r 陶瓷——<b>尺寸與頻寬的直接對價，又一次呼應 Chu 極限</b>。</p>
<p>進階手法：堆疊貼片（兩諧振點合併，可達 15–30%）、孔徑耦合饋入（饋入層與輻射層各自最佳化）、U 型槽/E 型貼片。</p>
<h3>饋入與阻抗控制</h3><p>貼片邊緣阻抗很高（200–400Ω，因為邊緣是電壓最大、電流最小處）。<b>內縮饋入</b>最優雅：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>R</mi><mi>in</mi></msub><mrow><mo>(</mo><msub><mi>y</mi><mn>0</mn></msub><mo>)</mo></mrow><mo>=</mo><msub><mi>R</mi><mi>in</mi></msub><mrow><mo>(</mo><mn>0</mn><mo>)</mo></mrow><mo>·</mo><msup><mi>cos</mi><mn>2</mn></msup><mrow><mo>(</mo><mfrac><mrow><msub><mi>πy</mi><mn>0</mn></msub></mrow><mi>L</mi></mfrac><mo>)</mo></mrow></mrow></math></div>
<p>只要調整凹入深度就能連續調整阻抗，不需任何額外元件。其他方式：同軸探針（同樣 cos² 關係）、四分之一波長轉換器、孔徑耦合（無實體連接、最乾淨但需多層板）。</p>
<h3>圓${L("極化")}貼片</h3><p>雙饋入+90°混合器（軸比頻寬可達 10%+）；或單饋入微擾——切掉兩對角、或用略微長方形貼片使兩正交簡併模分裂，在兩諧振點之間一模電感性、一模電容性恰成 90°。<b>成本最低但軸比頻寬僅 1–2%</b>，這正是 GPS 貼片對製程公差極度敏感的原因。</p>`},
{id:"行波與寬頻天線",ch:"11",en:"Ch.11 · Traveling Wave & Broadband",cat:"基本型",html:`<div class="callout"><b>這章的問題：</b>八木只有一個單元接線，為什麼其他沒接線的金屬棒能提高增益？對數週期為何能做到 10:1 頻寬？螺旋為何天生圓${L("極化")}？</div>
<h3>駐波天線 vs 行波天線</h3><p>偶極、貼片屬<b>駐波（諧振）天線</b>：波來回反射形成駐波，只在特定頻率諧振，天生窄頻。<b>行波天線</b>讓波沿結構單向傳播、邊走邊輻射，末端用吸收負載或漸變避免反射——沒有駐波條件，故頻寬可以做得很寬。</p>
<h3>八木：寄生單元如何造出方向性</h3><p>驅動單元（唯一接線，常用折疊偶極）、反射器（後方，<b>略長</b> +5%）、導向器（前方，<b>略短</b> −5%）。寄生單元沒接線，但驅動單元的場在其上<b>感應出電流</b>，這股電流也會輻射。</p>
<p><b>長度為什麼決定角色</b>——這是關鍵推導：偶極略長時呈<b>電感性</b>、略短時呈<b>電容性</b>，而感應電流的相位由該單元阻抗決定。反射器（電感性）電流相位<b>落後</b>，其輻射在後方相消、前方相長；導向器（電容性）相位<b>超前</b>，配合 0.15–0.25λ 間距造成的空間相位差，同樣在前方相長。</p>
<p>換言之，<b>八木是用「單元長度」調相位、用「單元間距」調空間相位差，形成端射陣列</b>——它其實是不用饋入網路的陣列。典型 3 單元 7–8dBi、10 單元 12–13dBi，但<b>頻寬窄（2–5%）</b>，因為它終究依賴諧振相位關係。<b>八木是高增益但窄頻的，不是寬頻天線。</b></p>
<h3>對數週期（LPDA）：真正的寬頻冠軍</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>τ</mi><mo>=</mo><mfrac><mrow><msub><mi>L</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><mrow><msub><mi>L</mi><mi>n</mi></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><mrow><msub><mi>R</mi><mi>n</mi></msub></mrow></mfrac><mo>&lt;</mo><mn>1</mn></mrow></math></div>
<p><b>為什麼能寬頻——作用區概念</b>：任一頻率下只有長度接近 λ/2 的<b>少數幾個單元</b>諧振並大量輻射，構成<b>作用區</b>；比它長的呈電感性、比它短的呈電容性，都不太參與。頻率改變時，<b>作用區只是沿天線平移到另外幾個單元</b>，電氣行為幾乎不變。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mrow><msub><mi>f</mi><mi>max</mi></msub></mrow><mrow><msub><mi>f</mi><mi>min</mi></msub></mrow></mfrac><mo>≈</mo><mfrac><mrow><msub><mi>L</mi><mi>max</mi></msub></mrow><mrow><msub><mi>L</mi><mi>min</mi></msub></mrow></mfrac></mrow></math></div>
<p>想要 10:1 頻寬，最長單元就要是最短的 10 倍——<b>又一次體積換頻寬</b>。<b>交叉饋入為何必要</b>：引入 180° 相位反轉，讓作用區前後單元組成正確的端射關係，使主波束指向短單元端；不交叉則指錯方向且增益大跌。<b>代價</b>：增益僅 6–10dBi，因為任一時刻只有少數單元在工作，其餘都是閒置重量——這是頻寬與增益的直接交易。</p>
<h3>螺旋天線：兩種模式</h3><p><b>法向模</b>（C≪λ）：輻射垂直於軸，可理解為短偶極與小迴圈的疊加，用途是<b>小型化</b>（把導線捲起來，在有限高度塞進更長電長度）。<b>軸向模</b>（C≈λ）：主波束沿軸（端射），且<b>天生圓極化</b>。</p>
<p><b>為什麼天生圓極化</b>：周長約一波長時，電流繞行一圈的過程中相位剛好變化 360°——電流的<b>空間旋轉與時間相位同步</b>，實實在在繞著軸轉圈，直接產生旋轉電場。旋向由纏繞方向決定。這是最「幾何自然」的圓極化，不需混合器或微擾，故<b>軸比頻寬極寬</b>（1.7:1 頻率比內軸比均優於 3dB），遠勝單饋入貼片的 1–2%，代價是<b>體積龐大</b>。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>G</mi><mo>≈</mo><mn>11.8</mn><mo>+</mo><mn>10</mn><mi>log</mi><mrow><mo>(</mo><msubsup><mi>C</mi><mi>λ</mi><mn>2</mn></msubsup><mo>·</mo><mi>N</mi><mo>·</mo><msub><mi>S</mi><mi>λ</mi></msub><mo>)</mo></mrow><mi>dB</mi><mtext>，　</mtext><msub><mi>Z</mi><mi>in</mi></msub><mo>≈</mo><mn>140</mn><mo>·</mo><msub><mi>C</mi><mi>λ</mi></msub><mi>Ω</mi></mrow></math></div>
<h3>其他頻率獨立天線</h3><p><b>雙錐/盤錐</b>：形狀主要由角度定義，符合角度決定原理。<b>等角螺旋</b>：r=r₀e^(aφ)，可達 10:1 以上且圓極化，常加背腔變單向（代價是壓縮頻寬）。<b>維瓦第（漸變槽線）</b>：超寬頻、端射、易組陣列，是現代 UWB 相位陣列的主力單元。</p>`},
{id:"喇叭天線",ch:"12",en:"Ch.12 · Horn Antennas",cat:"孔徑",html:`<div class="callout"><b>這章的問題：</b>為什麼波導末端要張開？既然孔徑越大增益越高，為什麼張太開反而讓增益下降？「最佳喇叭」的最佳是什麼意思？</div>
<h3>為什麼要張開——兩個問題一次解決</h3><p>直接截斷波導會遇到：<b>(1) 阻抗嚴重失配</b>（波導波阻抗與 377Ω 差距大，突然截斷造成強反射）；<b>(2) 孔徑太小</b>（G=η·4πA/λ²，孔徑直接決定增益上限）。喇叭的漸變張開<b>同時解決兩者</b>：截面積逐漸擴大讓波阻抗<b>平滑</b>過渡（漸變匹配的頻寬遠優於突變），同時放大孔徑。這使喇叭成為低反射、寬頻、高效率的經典設計，也是量測領域的標準參考天線。</p>
<h3>核心矛盾：孔徑相位誤差</h3><p>理想孔徑希望孔徑面上<b>等相位</b>（平面波前）。但喇叭中的波從喉部以<b>球面波</b>擴散，抵達孔徑時<b>中心路徑比邊緣短</b>——邊緣相位落後。用與遠場條件完全相同的畢氏近似：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>Δr</mi><mo>≈</mo><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>8</mn><mi>ρ</mi><mo>)</mo></mrow></mfrac><msub><mi>Δφ</mi><mi>max</mi></msub><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>λ</mi></mfrac><mo>)</mo></mrow><mo>·</mo><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>8</mn><mi>ρ</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mi>πa</mi><mn>2</mn></msup></mrow><mrow><mo>(</mo><mn>4</mn><mi>λρ</mi><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>定義無因次參數 s ≡ a²/(8λρ)，這是喇叭設計的核心變數。</p>
<h3>最佳喇叭——為什麼張太開增益反而下降</h3><p>固定長度 ρ 把張角加大：<b>好處</b>是孔徑面積變大、增益上限提高；<b>壞處</b>是相位誤差 ∝a²/ρ <b>以平方速度惡化</b>、孔徑效率下降。實際增益 G = η_ap·4πA_p/λ² 是兩者乘積——<b>兩條相反趨勢相乘，必然存在極大值</b>，這就是「最佳喇叭」。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>E</mi><mtext>面：</mtext><mi>s</mi><mo>=</mo><mn>0.25</mn><mtext>，</mtext><msub><mi>a</mi><mi>E</mi></msub><mo>≈</mo><msqrt><mn>2</mn><msub><mi>λρ</mi><mi>E</mi></msub></msqrt><mi>H</mi><mtext>面：</mtext><mi>s</mi><mo>=</mo><mn>0.375</mn><mtext>，</mtext><msub><mi>a</mi><mi>H</mi></msub><mo>≈</mo><msqrt><mn>3</mn><msub><mi>λρ</mi><mi>H</mi></msub></msqrt></mrow></math></div>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mtext>此時</mtext><msub><mi>η</mi><mi>ap</mi></msub><mo>≈</mo><mn>0.51</mn><mi>G</mi><mo>≈</mo><mn>0.51</mn><mo>·</mo><mn>4</mn><mi>π</mi><mo>·</mo><msub><mi>a</mi><mi>E</mi></msub><mo>·</mo><mfrac><mrow><msub><mi>a</mi><mi>H</mi></msub></mrow><mrow><msup><mi>λ</mi><mn>2</mn></msup></mrow></mfrac></mrow></math></div>
<p><b>為什麼 E 面與 H 面最佳值不同</b>：波導主模 TE₁₀ 的孔徑場在兩方向分布不同——H 面是餘弦分布（邊緣自然較弱、本身就有錐削效果，對相位誤差較不敏感，故可容忍較大 s），E 面是均勻分布（邊緣滿載、對相位誤差敏感）。這也造成兩面的旁瓣不同：均勻分布的 E 面約 −13dB，餘弦分布的 H 面低到約 −23dB。</p>
<h3>波紋喇叭：為什麼衛星地面站都用它</h3><p>標準角錐喇叭有兩個缺點：E/H 面場型不對稱（作饋源時照射不均）、交叉${L("極化")}較高。<b>波紋喇叭</b>在內壁刻出深約 λ/4 的環形溝槽，這些溝槽呈<b>高阻抗表面</b>，強迫切向電場在壁面為零——不論 E 面或 H 面都一樣。孔徑場遂變成軸對稱的<b>混合模 HE₁₁</b>（近似高斯分布），得到三個優點：<b>E/H 面場型幾乎完全對稱</b>、<b>旁瓣可低於 −30dB</b>、<b>交叉極化可低於 −40dB</b>。</p>
<p>代價是製造複雜昂貴。<b>這是衛星地面站與電波望遠鏡饋源的標準選擇</b>——對這些應用而言，低旁瓣直接關係到 ${L("天線雜訊溫度與G/T")}，值得付出成本。</p>
<h3>實務要點</h3><p><b>標準增益喇叭（SGH）</b>是量測基準，因為增益可由幾何尺寸<b>理論計算</b>到 ±0.2dB 以內，不需另外校正——這是三天線法的基礎。<b>頻寬</b>受限於波導單模工作頻段（典型 1.5:1），是少數「寬頻又高增益」的天線，因為它靠孔徑尺寸而非諧振取得增益，不受 Chu 極限的窄頻詛咒（它一點也不是電小天線）。</p>`},
{id:"反射面天線",ch:"13",en:"Ch.13 · Reflector Antennas",cat:"孔徑",html:`<div class="callout"><b>這章的問題：</b>拋物面為什麼能把球面波變平面波？為什麼饋源不能均勻照射整個碟面？表面誤差要多精密才夠？</div>
<h3>拋物面的等光程性質</h3><p>拋物面的定義性質是：<b>從焦點出發、經反射後平行於軸的所有路徑，總長度完全相同。</b>把饋源放在焦點，其<b>球面波</b>經反射後抵達孔徑平面時<b>所有射線相位完全相同</b>——形成理想平面波前。回想喇叭中「孔徑相位誤差是增益殺手」，拋物面等於用幾何手段把相位誤差歸零，這正是它能達到極高增益的原因。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>G</mi><mo>=</mo><msub><mi>η</mi><mi>ap</mi></msub><mo>·</mo><msup><mrow><mo>(</mo><mfrac><mi>πD</mi><mi>λ</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><msub><mi>θ</mi><mi>HPBW</mi></msub><mo>≈</mo><mn>70</mn><mo>°</mo><mo>·</mo><mfrac><mi>λ</mi><mi>D</mi></mfrac><mtext>　　典型</mtext><msub><mi>η</mi><mi>ap</mi></msub><mo>=</mo><mn>0.55</mn><mo>–</mo><mn>0.70</mn></mrow></math></div>
<h3>孔徑效率的五個殺手</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>η</mi><mi>ap</mi></msub><mo>=</mo><msub><mi>η</mi><mi>sp</mi></msub><mo>·</mo><msub><mi>η</mi><mi>t</mi></msub><mo>·</mo><msub><mi>η</mi><mi>b</mi></msub><mo>·</mo><msub><mi>η</mi><mi>s</mi></msub><mo>·</mo><msub><mi>η</mi><mi>x</mi></msub></mrow></math></div>
<p><b>(1) 溢波 η_sp</b>：饋源輻射有一部分沒打到碟面。饋源波束越窄，溢波越少。<b>(2) 照射錐削 η_t</b>：碟面中心照度高、邊緣低，<b>孔徑照射不均勻會降低有效面積</b>。饋源波束越寬（照射越均勻），錐削損耗越小。</p>
<p><b>這兩者直接對立</b>：饋源波束<b>窄</b>→溢波少但錐削嚴重；波束<b>寬</b>→照射均勻但大量能量溢出碟外。兩者相乘必有極值。</p>

<p><b>經典結論：饋源在碟緣的照度比中心低約 −10 到 −12 dB 時乘積最大</b>，總孔徑效率約 80%（再乘其他損耗得實務 55–70%）。<b>這是反射面設計最重要的經驗法則</b>，它決定饋源該選多寬的波束、進而決定 F/D。</p>
<p>低旁瓣需求會改變這個最佳點：電波望遠鏡為壓低旁瓣（減少接收地面熱雜訊）會刻意採用更強錐削（−15 到 −20dB），犧牲增益換低旁瓣與低系統雜訊溫度。</p>
<p><b>(3) 遮擋 η_b</b>：饋源、副反射面、支撐架擋住部分孔徑，不只損失增益，散射還會<b>抬高旁瓣</b>。這是<b>偏饋</b>設計的主要動機——把饋源移出孔徑投影，完全消除遮擋（家用小耳朵幾乎都是偏饋）。<b>(5) 交叉${L("極化")} η_x</b>：曲面反射會轉換部分能量到正交極化。</p>
<h3>Ruze 公式：表面精度</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>η</mi><mi>s</mi></msub><mo>=</mo><mi>exp</mi><mrow><mo>[</mo><mo>−</mo><msup><mrow><mo>(</mo><mfrac><mrow><mn>4</mn><mi>πε</mi></mrow><mi>λ</mi></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>]</mo></mrow></mrow></math></div>
<p><b>推導邏輯</b>：表面偏差 ε 造成往返路徑差 2ε，相位誤差 Δφ=(2π/λ)·2ε=4πε/λ。假設誤差呈高斯隨機分布，各孔徑元因隨機相位部分失去相長性，統計平均後得指數衰減。</p>
<p>ε=λ/50 → 0.28dB；λ/32 → 0.67dB；λ/16 → 2.7dB；λ/8 → 10.7dB。業界常用 <b>ε ≤ λ/16</b> 為門檻。</p>
<p><b>這解釋了電波望遠鏡的工程難度</b>：30m 碟要工作在 100GHz（λ=3mm），表面 RMS 必須小於 0.06mm——在 30 公尺結構上，還要承受重力隨仰角變化的形變、日照熱變形與風壓。這正是大型毫米波望遠鏡需要<b>主動面板調整</b>的原因。Ruze 也說明每座碟都有一個「效率開始崩潰」的頻率上限。</p>
<h3>F/D 與雙反射面</h3><p><b>F/D 小（深碟）</b>：碟緣張角大，需寬波束饋源；結構緊湊但交叉極化較高。<b>F/D 大（淺碟）</b>：需窄波束饋源；性能好但饋源要伸得遠。設計流程實際是反過來的：先選饋源、量其波束寬，再挑 F/D 使<b>碟緣正好落在饋源的 −10dB 等高線上</b>。</p>
<p><b>卡塞格倫</b>（主拋物面+雙曲面副面）把焦點折回主面中央：<b>饋源移到碟後靠近接收機</b>——這對低雜訊系統極關鍵，因為饋源到 LNA 的傳輸線損耗會直接惡化系統雜訊溫度；同時等效焦距放大，可用窄波束饋源達成低交叉極化。<b>格里高利</b>用橢球面副面，有實焦點可供校準。<b>電波望遠鏡幾乎都用這兩種架構。</b></p>`},
{id:"陣列天線與陣列因子",ch:"14",en:"Ch.14 · Arrays & Array Factor",cat:"陣列",html:`<div class="callout"><b>這章的問題：</b>場型相乘原理為什麼成立？N 個單元的增益為什麼是 N 倍？旁瓣 −13.5dB 這個數字從哪來？</div>
<h3>場型相乘原理</h3><p>考慮 N 個<b>完全相同、方向一致</b>的單元，第 n 個的貢獻是單元場型乘上激發係數 a_n 與空間相位延遲：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>E</mi><mi>total</mi></msub><mo>=</mo><msub><mi>E</mi><mi>e</mi></msub><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>×</mo><mi>AF</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow></mrow></math></div>
<p><b>為什麼能拆開</b>：關鍵在「所有單元相同且方向一致」，E_e 對每個單元都一樣，可提到求和之外；AF 則只跟<b>位置與激發</b>有關，完全不管單元是偶極、貼片還是喇叭。<b>這個拆解價值極大</b>：陣列設計可先純粹處理 AF（純幾何/相位問題），選單元是另一個獨立問題。</p>
<p><b>前提失效時要小心</b>：實際有<b>互耦</b>，邊緣單元環境與中央不同，單元場型不再完全相同，高性能陣列必須用全波模擬處理。</p>
<h3>均勻線性陣列的陣列因子</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>ψ</mi><mo>=</mo><mi>βd</mi><mo>·</mo><mi>cosθ</mi><mo>+</mo><mi>α</mi><mtext>　（相鄰兩單元的總相位差）</mtext></mrow></math></div>

<p>這是離散版 sinc（Dirichlet 核）。主瓣在 ψ=0（所有單元同相，AF=N）；零點在 Nψ/2=mπ；第一旁瓣約在 Nψ/2=3π/2，高度為：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mrow><mo>|</mo><mi>AF</mi><mo>|</mo></mrow><mi>N</mi></mfrac><mo>≈</mo><mfrac><mn>2</mn><mrow><mo>(</mo><mn>3</mn><mi>π</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mn>0.212</mn><mo>=</mo><mo>−</mo><mn>13.46</mn><mi>dB</mi></mrow></math></div>
<p><b>這就是那個著名的均勻陣列第一旁瓣位準</b>。它是<b>均勻激發的必然結果</b>，跟單元種類、間距、頻率通通無關——純粹是這個數學函數的性質。</p>
<h3>為什麼增益是 N 倍</h3><p>主瓣方向所有單元同相疊加，<b>場強</b>是單一單元的 N 倍，<b>功率密度</b>是 N² 倍；但總輸入功率也是 N 倍（餵了 N 個單元）。因此：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>D</mi><mi>array</mi></msub><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><msup><mi>N</mi><mn>2</mn></msup></mrow><mi>N</mi></mfrac><mo>)</mo></mrow><mo>·</mo><msub><mi>D</mi><mi>element</mi></msub><mo>=</mo><mi>N</mi><mo>·</mo><msub><mi>D</mi><mi>element</mi></msub><msub><mi>G</mi><mi>dB</mi></msub><mo>=</mo><msub><mi>G</mi><mi>element</mi></msub><mo>+</mo><mn>10</mn><mi>log</mi><mrow><mo>(</mo><mi>N</mi><mo>)</mo></mrow></mrow></math></div>
<p><b>單元數加倍，增益增加 3dB</b>。想要 +20dB 就需要 100 個單元——而成本、饋入網路複雜度、功耗都隨 N 線性成長，<b>這是相位陣列雷達昂貴的根本原因</b>。</p>
<h3>端射 vs 側射</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>cosθ</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mo>−</mo><mi>α</mi></mrow><mrow><mo>(</mo><mi>βd</mi><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>α=0（同相）→ θ₀=90°，<b>側射</b>；α=−βd → θ₀=0°，<b>端射</b>（八木正是靠寄生單元長度差製造出這個相位關係）；其他 α 值 → 波束指向中間角度，這就是電子掃描的原理。<b>Hansen-Woodyard 條件</b>：把 α 設得比 −βd 再多一點可再提升端射方向性約 1.8dB，代價是旁瓣升高。</p>
<h3>振幅錐削：用旁瓣換波束寬</h3><p>均勻激發給出最窄主瓣但旁瓣固定 −13.5dB。若對旁瓣有嚴格要求（雷達抗干擾、射電天文避免收到地面雜訊），可讓邊緣單元振幅小於中央：均勻（−13.5dB，最窄）；三角形（−26.5dB，波束×1.44）；二項式（無旁瓣，波束×1.9+）；<b>Dolph-Chebyshev</b>（在指定旁瓣下理論最窄，所有旁瓣等高）；Taylor（實務上更易實現）。</p>
<p><b>核心取捨永遠是：壓低旁瓣 → 主瓣變寬 → 方向性下降。</b>這與反射面的照射錐削、喇叭 H 面較低的旁瓣是<b>完全同一個物理</b>。</p>`},
{id:"相位陣列與波束掃描",ch:"15",en:"Ch.15 · Phased Arrays",cat:"陣列",html:`<div class="callout"><b>這章的問題：</b>只改變相位就能轉動波束，物理上發生了什麼？為什麼間距超過半波長會冒出柵瓣？為什麼掃描角越大波束越胖？</div>
<h3>電子掃描原理</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>α</mi><mo>=</mo><mo>−</mo><mi>βd</mi><mo>·</mo><msub><mi>sinθ</mi><mi>s</mi></msub></mrow></math></div>
<p><b>物理圖像</b>：要讓波束指向 θ_s，所有單元發出的波必須在該方向同相抵達。但斜向路徑不同——相鄰單元到遠方同一波前的路徑差是 d·sinθ_s。我們用<b>電子相位差預先補償這個路徑差</b>，讓路徑較短的單元「晚一點發」，於是在目標方向恰好對齊。這就是相位陣列的全部精髓：不轉動任何機械結構，微秒內把波束指向任意方向。</p>
<h3>柵瓣：為什麼間距不能超過半波長</h3><p>|AF| 中 ψ 出現在正弦函數裡，而正弦是<b>週期函數</b>。主瓣在 ψ=0，但 <b>ψ=±2π 時分母同樣為零，同樣產生與主瓣等高的波瓣</b>——這就是<b>柵瓣</b>。它不是旁瓣（旁瓣比主瓣低），而是貨真價實的第二個主瓣，會把能量送到錯誤方向或從錯誤方向收進干擾。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mi>d</mi><mi>λ</mi></mfrac><mo>&lt;</mo><mfrac><mn>1</mn><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mrow><mo>|</mo><msub><mi>sinθ</mi><mi>s</mi></msub><mo>|</mo></mrow><mo>)</mo></mrow></mfrac></mrow></math></div>
<p>不掃描 → d&lt;λ；掃 ±30° → d&lt;0.67λ；掃 ±60° → d&lt;0.54λ；掃 ±90° → d&lt;0.5λ。<b>所以「半波長間距」這個慣例，其實是「要能掃到任意角度都不出柵瓣」的保守設計</b>——若應用只需小角度掃描，間距可放寬，能大幅減少單元數與成本。</p>
<p>柵瓣的代價很現實：間距被鎖在 λ/2 附近，意味著要達到某個孔徑尺寸，單元數就被下限鎖死。10λ×10λ 陣列需要約 400 個單元，每個都要移相器與功率放大器。</p>
<h3>掃描時的波束展寬與增益下降</h3><p>從 θ_s 方向看過去，陣列<b>投影長度</b>是 L·cosθ_s（而非 L）。由 θ≈λ/D：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>θ</mi><mi>HPBW</mi></msub><mrow><mo>(</mo><msub><mi>θ</mi><mi>s</mi></msub><mo>)</mo></mrow><mo>≈</mo><mfrac><mrow><msub><mi>θ</mi><mi>HPBW</mi></msub><mrow><mo>(</mo><mn>0</mn><mo>)</mo></mrow></mrow><mrow><msub><mi>cosθ</mi><mi>s</mi></msub></mrow></mfrac><mi>G</mi><mrow><mo>(</mo><msub><mi>θ</mi><mi>s</mi></msub><mo>)</mo></mrow><mo>≈</mo><mi>G</mi><mrow><mo>(</mo><mn>0</mn><mo>)</mo></mrow><mo>·</mo><msub><mi>cosθ</mi><mi>s</mi></msub></mrow></math></div>
<p>掃到 60° 波束寬變兩倍、增益掉 3dB；掃到 70° 掉約 4.7dB，再加上單元本身場型的衰減更嚴重。<b>這就是相位陣列實用掃描範圍通常限制在 ±60° 的原因</b>。需要全空域覆蓋時用<b>多個面</b>（神盾艦的四面陣列）。</p>
<h3>移相器 vs 真實時延：頻寬陷阱</h3><p>注意 α=−βd·sinθ_s 中的 β=2π/λ <b>與頻率有關</b>。若用固定相位的移相器，只有設計頻率上波束指向正確，頻率偏移時波束會漂移——這叫<b>波束斜視</b>。對窄頻影響有限，但<b>寬頻系統會嚴重失真</b>：不同頻率成分指向不同方向。</p>
<p><b>根本解法是真實時延（TTD）</b>：時延 τ=(d·sinθ_s)/c 對所有頻率都給出正確補償（它補償的是「時間」而非「相位」）。代價是體積大、成本高、損耗大。<b>實務折衷是子陣列架構</b>：子陣列之間用 TTD，子陣列內部用移相器。</p>
<h3>稀疏陣列</h3><p>柵瓣的成因是<b>週期性排列</b>（週期結構的傅立葉轉換必然有重複譜峰）。改用<b>非均勻/隨機佈局</b>，柵瓣能量會被打散成較低的旁瓣底噪，不再集中成假波束。優點是用少得多的單元達到大孔徑；代價是平均旁瓣抬高、增益低於同孔徑滿陣列。<b>電波望遠鏡陣列（VLA、ALMA）正是這個思路的極致</b>——刻意非週期佈局以獲得良好 uv 覆蓋並避免成像假影。</p>
<h3>數位波束成形</h3><p>每個單元都有自己的收發機與 ADC/DAC，波束成形在數位域完成：<b>可同時形成多個波束</b>、可即時自適應在干擾方向形成零點。代價是每單元都要完整收發鏈，功耗與成本極高。這是 5G Massive MIMO 與現代電子戰的核心技術。</p>`},
{id:"Friis傳輸與鏈路預算",ch:"16",en:"Ch.16 · Friis & Link Budget",cat:"系統",html:`<div class="callout"><b>這章的問題：</b>「自由空間路徑損耗」隨頻率平方增加——但自由空間明明不吸收能量，這個「損耗」到底損在哪？（天線工程最常見的觀念陷阱。）</div>
<h3>三步推導</h3><p><b>1.</b> 發射端功率密度：等向性時 P_t/(4πR²)，有增益則 S = P_tG_t/(4πR²)。<b>2.</b> 接收端攔截：P_r = S·A_er。<b>3.</b> 代入 A_e=λ²G/4π：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>r</mi></msub><mo>=</mo><msub><mi>P</mi><mi>t</mi></msub><mo>·</mo><msub><mi>G</mi><mi>t</mi></msub><mo>·</mo><msub><mi>G</mi><mi>r</mi></msub><mo>·</mo><msup><mrow><mo>(</mo><mfrac><mi>λ</mi><mrow><mn>4</mn><mi>πR</mi></mrow></mfrac><mo>)</mo></mrow><mn>2</mn></msup></mrow></math></div>
<p>整個推導只用到三件事：球面能量守恆、增益定義、有效面積與增益的關係。</p>
<h3>那個 (λ/4πR)² —— 最重要的觀念釐清</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>FSPL</mi><mi>dB</mi></msub><mo>=</mo><mn>20</mn><mi>log</mi><mrow><mo>(</mo><mi>R</mi><mo>)</mo></mrow><mo>+</mo><mn>20</mn><mi>log</mi><mrow><mo>(</mo><mi>f</mi><mo>)</mo></mrow><mo>−</mo><mn>147.55</mn></mrow></math></div>
<p>這個式子說「頻率越高路徑損耗越大」。但自由空間是真空，不吸收任何能量——<b>能量損失到哪去了？答案是根本沒有損失。</b></p>
<p>R² 部分是真實的幾何擴散；但 <b>λ² 部分完全不是傳播現象</b>——它來自第三步把 A_er 換成 G_r 時引入的 λ²。換言之，<b>「高頻損耗大」的真正意思是「在固定增益的前提下，高頻天線的物理孔徑較小，所以攔截的能量較少」</b>。</p>
<p>換個寫法就一目了然：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>r</mi></msub><mo>=</mo><msub><mi>P</mi><mi>t</mi></msub><mo>·</mo><msub><mi>A</mi><mi>et</mi></msub><mo>·</mo><mfrac><mrow><msub><mi>A</mi><mi>er</mi></msub></mrow><mrow><mo>(</mo><msup><mi>λ</mi><mn>2</mn></msup><msup><mi>R</mi><mn>2</mn></msup><mo>)</mo></mrow></mfrac></mrow></math></div>
<p><b>λ² 現在跑到分母去了！</b>也就是說：<b>收發兩端若固定物理孔徑（例如兩個固定大小的碟），頻率越高收到的功率反而越大</b>——孔徑固定時增益隨 f² 上升，兩端各一次共 f⁴，扣掉 FSPL 的 f²，淨得 f²。<b>這正是衛星通訊與微波回程往高頻走的原因。</b>所謂「高頻傳不遠」只在「增益固定」的假設下成立，而這在定向通訊中通常不成立。（高頻真正的困難是大氣吸收、雨衰、繞射能力差與元件成本。）</p>
<h3>完整鏈路預算</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>r</mi></msub><mo>=</mo><mrow><mo>[</mo><msub><mi>P</mi><mi>t</mi></msub><mo>+</mo><msub><mi>G</mi><mi>t</mi></msub><mo>−</mo><msub><mi>L</mi><mi>t</mi></msub><mo>]</mo></mrow><mo>−</mo><mi>FSPL</mi><mo>−</mo><msub><mi>L</mi><mi>atm</mi></msub><mo>−</mo><msub><mi>L</mi><mi>rain</mi></msub><mo>−</mo><msub><mi>L</mi><mi>pol</mi></msub><mo>−</mo><msub><mi>L</mi><mi>point</mi></msub><mo>+</mo><msub><mi>G</mi><mi>r</mi></msub><mo>−</mo><msub><mi>L</mi><mi>r</mi></msub></mrow></math></div>
<p><b>EIRP</b> = P_t+G_t−L_t（法規管制的量）；<b>L_r</b> 特別關鍵——它不只衰減訊號，還直接惡化系統雜訊溫度；<b>L_atm</b>（氧氣 60GHz、水氣 22GHz 有吸收峰）；<b>L_rain</b>（10GHz 以上急遽惡化）；<b>L_pol</b>（圓對線固定 3dB）；<b>L_point</b>（波束越窄越敏感——高增益的代價）。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>Link</mi><mi>Margin</mi><mo>=</mo><msub><mi>P</mi><mi>r</mi></msub><mo>−</mo><msub><mi>P</mi><mi>r</mi></msub><mo>,</mo><mi>min</mi><msub><mi>P</mi><mi>r</mi></msub><mo>,</mo><mi>min</mi><mo>=</mo><msub><mi>kT</mi><mi>sys</mi></msub><mo>·</mo><mi>B</mi><mo>·</mo><msub><mrow><mo>(</mo><mfrac><mi>S</mi><mi>N</mi></mfrac><mo>)</mo></mrow><mi>req</mi></msub></mrow></math></div>
<p>餘裕不是浪費而是買保險：涵蓋雨衰統計、指向誤差、老化、溫漂。衛星通訊典型 3–6dB，深空通訊壓到 1–2dB。</p>
<h3>實際數字：GPS</h3><p>EIRP≈27dBW；距離 20200km @1575.42MHz → FSPL≈<b>182.4dB</b>；接收貼片增益約 3dBi ⟹ P_r ≈ <b>−122.4dBm</b>。這比一般接收機熱雜訊底還低約 11dB——<b>訊號完全埋在雜訊裡</b>。GPS 能運作是靠<b>展頻處理增益</b>（約 43dB）把訊號從雜訊中挖出來。</p>
<h3>非自由空間</h3><p><b>雙射線模型</b>：收發都靠近地面時，直射與反射波干涉，遠距離衰減變成 R⁴ 而非 R²。<b>繞射與遮蔽</b>：第一菲涅耳區被遮超過 40% 就有顯著損失。<b>多重路徑衰落</b>：都市典型問題，也是 MIMO 要對付的對象。</p>`},
{id:"天線雜訊溫度與G/T",ch:"17",en:"Ch.17 · Noise Temperature & G/T",cat:"系統",html:`<div class="callout"><b>這章的問題：</b>天線本身不發熱，為什麼會有「雜訊溫度」？為什麼旁瓣指向地面會毀掉整個接收系統？為什麼看的是 G/T 而不是增益？</div>
<div class="callout" style="border-left-color:#e11d48"><b>這一章與「天文接收機」專案最直接相關</b>——接收微弱訊號的系統，品質完全不由增益單獨決定。</div>
<h3>雜訊溫度：把任何雜訊源換算成等效溫度</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><mi>kTB</mi><mtext>　（</mtext><mi>k</mi><mo>=</mo><mn>1.38</mn><mo>×</mo><mfrac><mrow><msup><mn>10</mn><mi>−23</mi></msup><mi>J</mi></mrow><mi>K</mi></mfrac><mtext>）</mtext></mrow></math></div>
<p>雜訊溫度的定義就是反過來用這個式子：不管雜訊實際來自什麼機制，都問「要一個多少度的電阻才能產生同樣的雜訊功率」。<b>為什麼好用</b>：它把五花八門的雜訊源統一成同一個單位（K），於是可以直接相加。</p>
<h3>天線雜訊溫度：看到什麼就有多熱</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>T</mi><mi>A</mi></msub><mo>=</mo><mo>∮</mo><msub><mi>T</mi><mi>B</mi></msub><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mo>·</mo><mfrac><mrow><mi>G</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mi>dΩ</mi></mrow><mrow><mo>∮</mo><mi>G</mi><mrow><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo></mrow><mi>dΩ</mi></mrow></mfrac></mrow></math></div>
<p><b>天線本身（理想無損）不產生雜訊——它只是把視野中各方向的雜訊「收集」進來。</b>環境亮度溫度差異巨大：宇宙微波背景 2.7K；晴朗天頂 5–20K；低仰角天空 50–100K；<b>地面/建物 290K</b>；太陽在微波頻段達數千至數萬 K。</p>
<p><b>旁瓣是致命的。</b>假設主瓣指向 10K 冷天空，但有 5% 的功率經旁瓣指向 290K 地面：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>T</mi><mi>A</mi></msub><mo>≈</mo><mn>0.95</mn><mo>×</mo><mn>10</mn><mo>+</mo><mn>0.05</mn><mo>×</mo><mn>290</mn><mo>=</mo><mn>24</mn><mi>K</mi></mrow></math></div>
<p><b>只要 5% 能量漏向地面，雜訊溫度就從 10K 惡化到 24K。</b>這就是為什麼反射面要刻意加強照射錐削、波紋喇叭的低旁瓣值得高昂成本、望遠鏡周圍要築屏蔽牆、觀測要避免低仰角。<b>注意這個取捨方向與一般通訊系統完全相反</b>：一般系統追求最大增益，接收微弱訊號的系統寧可犧牲 0.5dB 增益去換旁瓣降低 10dB。</p>
<h3>系統雜訊溫度</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mtext>T_sys = T_A + T_feed + T_LNA + T_</mtext><mtext>後級</mtext><mtext>/G_LNA</mtext><msub><mi>T</mi><mi>line</mi></msub><mo>=</mo><mrow><mo>(</mo><mi>L</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mo>·</mo><msub><mi>T</mi><mn>0</mn></msub></mrow></math></div>
<p><b>為什麼有損元件會「產生」雜訊</b>：它同時是衰減器與熱源——衰減訊號 L 倍，卻按自己的物理溫度注入熱雜訊。一段 1dB 損耗的饋線在 290K 下貢獻 <b>75K</b>，對一個天空只有 10K 的系統是災難。</p>
<p>這解釋兩個關鍵實踐：<b>(1) LNA 必須盡可能靠近饋源</b>——每一段在 LNA 之前的傳輸線都是純粹的傷害，這正是卡塞格倫架構的重要價值。<b>(2)</b> 由 Friis 雜訊級聯，後級雜訊被前級增益除掉，<b>第一級放大器幾乎決定整個系統</b>——這是射電天文 LNA 要低溫製冷到 15–20K 的原因。</p>
<h3>G/T：接收系統的單一品質因數</h3><div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mi>S</mi><mi>N</mi></mfrac><mo>=</mo><mrow><mo>(</mo><mfrac><mrow><msub><mi>P</mi><mi>t</mi></msub><msub><mi>G</mi><mi>t</mi></msub></mrow><mi>FSPL</mi></mfrac><mo>)</mo></mrow><mo>·</mo><mrow><mo>(</mo><mfrac><mn>1</mn><mi>kB</mi></mfrac><mo>)</mo></mrow><mo>·</mo><mrow><mo>(</mo><mfrac><mrow><msub><mi>G</mi><mi>r</mi></msub></mrow><mrow><msub><mi>T</mi><mi>sys</mi></msub></mrow></mfrac><mo>)</mo></mrow></mrow></math></div>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mfrac><mrow><msub><mrow><mo>(</mo><mfrac><mi>G</mi><mi>T</mi></mfrac><mo>)</mo></mrow><mi>dB</mi></msub></mrow><mi>K</mi></mfrac><mo>=</mo><msub><mi>G</mi><mi>dBi</mi></msub><mo>−</mo><mn>10</mn><mi>log</mi><mrow><mo>(</mo><msub><mi>T</mi><mi>sys</mi></msub><mo>)</mo></mrow></mrow></math></div>
<p><b>所有跟接收站有關的參數濃縮成 G/T 這一個比值</b>。它誠實反映了「提高增益」與「降低雜訊」對訊雜比有<b>完全等價</b>的貢獻——+3dB 增益跟把雜訊溫度減半，價值完全相同。</p>
<p><b>由此帶來一個違反直覺但極重要的判斷</b>：若某設計變更讓增益 +0.5dB，但旁瓣抬高使 T_sys 從 30K 升到 40K，則 Δ(G/T) = +0.5 − 10log(40/30) = <b>−0.75 dB</b>——<b>這個「增益提升」實際上讓系統變差了</b>。這就是為什麼專業接收天線規格書標的是 G/T 而非增益；只看增益會做出錯誤的設計決策。</p>
<h3>實際數字</h3><p>家用小耳朵（60cm）16 dB/K；VSAT（2.4m）28；大型地面站（13m）44；<b>電波望遠鏡（製冷接收機）58+</b>；深空網路（70m）61。注意望遠鏡的 T_sys 只有 15–25K——這是製冷 LNA、波紋喇叭饋源、極低旁瓣、饋線最短化四者共同的成果。</p>
<p><b>其他考量</b>：天線罩損耗同樣按 (L−1)T₀ 貢獻雜訊（潮濕表面使損耗大增）；T_A 隨仰角降低而上升，故設有最低操作仰角；<b>太陽干擾</b>——春秋分前後同步衛星與太陽同向，通訊中斷數分鐘，可精準預測。</p>`},
{id:"天線量測",ch:"18",en:"Ch.18 · Antenna Measurement",cat:"系統",html:`<div class="callout"><b>這章的問題：</b>大型天線的遠場距離動輒數十公里，物理上量不到——實驗室裡怎麼量出場型與增益？增益的絕對值怎麼量？</div>
<h3>遠場量測與它的極限</h3><p>3m 碟 @12GHz 需 720m，30m 望遠鏡 @10GHz 需 60km。就算場地夠大還有地面反射、大氣擾動、環境干擾、訊號微弱等問題。改善手法：<b>斜距場</b>（架在兩座高塔減少地面反射）、<b>地面反射場</b>（反過來刻意利用反射，設計幾何使直射與反射波在 AUT 位置相長）。</p>
<h3>消聲室</h3><p>金屬屏蔽室內壁貼滿<b>吸波尖劈</b>。<b>為什麼是尖劈</b>：平板吸波材的介面會有阻抗突變造成反射，尖劈讓等效阻抗<b>沿深度漸變</b>，從 377Ω 平滑過渡到吸波材——這與喇叭的漸變匹配、漸變傳輸線是<b>完全相同的物理原理</b>。關鍵指標是<b>靜區</b>（反射波低於直射波某個位準，如 −40dB），AUT 必須放在其中。</p>
<h3>緊縮場（CATR）：偽造平面波</h3><p>既然遠場的本質是平面波前，就用一面<b>偏饋拋物面</b>把饋源的球面波轉成平面波（正是反射面的等光程原理反過來用），在幾公尺內產生近似平面波前。<b>設計難點是邊緣繞射</b>——解法是把邊緣做成<b>鋸齒狀</b>或<b>捲曲邊緣</b>，把繞射能量散射到靜區之外。優點是室內、全天候；限制是靜區只有反射鏡的 1/3–1/2 且造價昂貴。</p>
<h3>近場量測：量近場，算遠場</h3><p><b>原理</b>：遠場場型是孔徑場分布的<b>空間傅立葉轉換</b>。所以只要在近場的掃描面上逐點量測<b>振幅與相位</b>，再做傅立葉轉換，就能算出遠場——<b>完全不需要真的走到遠場去</b>。</p>
<p>三種幾何：<b>平面掃描</b>（最簡單，適合高增益單向天線，但只能還原有限角度範圍）、<b>柱面掃描</b>（適合扇形波束）、<b>球面掃描</b>（可還原完整 4π，適合低增益全向天線，但最耗時）。</p>
<p><b>三個關鍵要求</b>：(1) <b>必須量相位</b>——這是與遠場量測最大的差別，需要向量網路分析儀。(2) <b>取樣間距 ≤ λ/2</b>（Nyquist 的空間版），否則傅立葉轉換出現混疊、在角度域表現為假波瓣。(3) <b>探棒補償</b>——探棒本身有場型，必須在後處理中反卷積掉。</p>
<p>近場量測還有一個獨有的強大能力：因為保留了完整複數場資訊，<b>可以反推孔徑場分布</b>，用於診斷陣列中的失效單元或反射面的表面誤差。</p>
<h3>增益量測：兩種方法</h3><p><b>(1) 增益比較法</b>：用已知增益的標準增益喇叭替換比較。最常用，因為 SGH 的增益可由幾何理論計算到 ±0.2dB。</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>G</mi><mi>AUT</mi></msub><mo>=</mo><msub><mi>G</mi><mi>std</mi></msub><mo>+</mo><mn>10</mn><mi>log</mi><mrow><mo>(</mo><mfrac><mrow><msub><mi>P</mi><mi>AUT</mi></msub></mrow><mrow><msub><mi>P</mi><mi>std</mi></msub></mrow></mfrac><mo>)</mo></mrow></mrow></math></div>
<p><b>(2) 三天線法</b>：連標準天線都沒有時，用三個未知天線量三次（AB、AC、BC），由 Friis 得三個方程、三個未知數：</p>
<div class="formula"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>G</mi><mi>A</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mrow><mo>[</mo><mrow><mo>(</mo><msub><mi>G</mi><mi>A</mi></msub><mo>+</mo><msub><mi>G</mi><mi>B</mi></msub><mo>)</mo></mrow><mo>+</mo><mrow><mo>(</mo><msub><mi>G</mi><mi>A</mi></msub><mo>+</mo><msub><mi>G</mi><mi>C</mi></msub><mo>)</mo></mrow><mo>−</mo><mrow><mo>(</mo><msub><mi>G</mi><mi>B</mi></msub><mo>+</mo><msub><mi>G</mi><mi>C</mi></msub><mo>)</mo></mrow><mo>]</mo></mrow></mrow></math></div>
<p><b>這是絕對增益校準的基礎</b>——所有標準增益喇叭的溯源，最終都要回到某次三天線法量測。</p>
<h3>其他量測</h3><p><b>阻抗</b>：VNA 量測，務必先校準（SOLT/TRL）把測試線影響移到參考面；平衡天線需巴倫。<b>軸比</b>：旋轉線${L("極化")}參考天線，取最大最小值之比。<b>效率</b>：<b>Wheeler Cap 法</b>——用金屬帽罩住消除輻射，量到的即 R_L；不罩時得 R_r+R_L，相減得 R_r。這是少數能直接分離輻射電阻與損耗電阻的巧妙方法。<b>G/T</b>：Y 因子法，分別指向冷天空與熱源比較功率。</p>
<h3>量測與模擬對不上的常見原因</h3><p>依序是：同軸外皮電流（缺巴倫）、有限地板尺寸、饋線與夾具散射、消聲室反射、連接器寄生效應、材料參數不準。</p>`},
{id:"天線模擬與設計流程",ch:"19",en:"Ch.19 · Simulation & Workflow",cat:"系統",html:`<div class="callout"><b>這章的問題：</b>MoM、FEM、FDTD 差在哪，什麼時候用哪個？網格要多細？為什麼模擬常跟實測對不上？</div>
<h3>三種求解器的分工</h3><p>都在解同一組馬克士威方程，差別在<b>離散化的對象</b>。</p>
<p><b>MoM（矩量法，解積分方程）</b>：未知數是<b>導體表面電流</b>，只離散導體本身，自由空間由格林函數處理。<b>優點</b>：未知數少、<b>輻射邊界天然精確</b>（格林函數本身就滿足無窮遠輻射條件，不需人工吸收邊界）。<b>缺點</b>：稠密矩陣、複雜非均勻介質困難。<b>適合</b>：導線天線、平面微帶、大型反射面。代表：FEKO、NEC、Sonnet。</p>
<p><b>FEM（有限元素，頻域微分方程）</b>：切四面體網格解整個體積。<b>優點</b>：<b>幾何適應性最強</b>、複雜非均勻/各向異性材料處理最好、稀疏矩陣。<b>缺點</b>：需離散整個體積含空氣、需人工吸收邊界、<b>每個頻率都要重解</b>。<b>適合</b>：波導/喇叭、多層複雜介質、封裝內天線。代表：HFSS。</p>
<p><b>FDTD（時域有限差分）</b>：規則立方網格，時間上逐步推進。<b>優點</b>：<b>一次模擬得到寬頻結果</b>（脈衝激發後 FFT）、記憶體隨 N 線性、易平行化與 GPU 加速。<b>缺點</b>：規則網格對曲面有<b>階梯化誤差</b>、高 Q 結構收斂慢。<b>適合</b>：超寬頻天線、SAR 分析。代表：CST。</p>
<p><b>GO/PO（高頻近似）</b>：不解完整方程，用射線追蹤或孔徑積分，適合結構遠大於波長（大型反射面、載台佈置分析）。</p>
<p><b>選擇原則</b>：平面分層選 MoM，封閉/複雜介質選 FEM，需寬頻一次掃完選 FDTD，尺寸遠大於波長選 PO。高階工作常需<b>混合法</b>（MoM 算饋源、PO 算大反射面）。</p>
<h3>網格密度：常見錯誤來源</h3><p>通則每波長 10–20 格，但要注意：<b>介質中波長會縮短</b>（λg=λ₀/√ε_r，ε_r=10 時只有 1/3.2，網格必須加密——<b>這是新手最常犯的錯</b>）；<b>細節尺寸主導</b>（饋入間隙、細縫、薄基板需局部加密）；<b>高 Q 結構需更細</b>（網格不足會使諧振頻率明顯偏移）。</p>
<p><b>唯一可靠的驗證是收斂測試</b>：網格加密一倍看結果變化多少，若諧振頻率仍在移動就代表還沒收斂。<b>沒做收斂測試的模擬結果不能信</b>——這是模擬工作最基本的紀律。</p>
<h3>邊界與激發</h3><p><b>PML</b> 是目前主流吸收邊界；邊界須離天線<b>至少 λ/4、建議 λ/2 以上</b>（近場儲能延伸到那麼遠），太近會人為改變輸入阻抗——這是阻抗算不準的常見原因。<b>激發源</b>：集總埠（簡單但對間隙敏感）、波導埠（解出真實傳輸線模式，最準確）、同軸模型（要準確反映探針電感時需建出實際結構）。</p>
<h3>典型設計流程</h3><p><b>(1) 規格定義</b>——此時就要用 Chu 極限檢查「這個尺寸下要求的頻寬是否物理上可能」，<b>很多專案失敗是因為一開始就接了不可能的規格</b>。<b>(2) 拓樸選擇</b>。<b>(3) 解析式初算</b>——不要跳過直接丟給優化器，好的初始值省下大量時間。<b>(4) 參數化掃描</b>——目的是建立物理直覺，不是找答案。<b>(5) 優化</b>——注意優化器容易給出「數值滿足但物理脆弱」的解，必須做公差分析。<b>(6) 蒙地卡羅公差分析</b>。<b>(7) 製作與量測</b>。<b>(8) 反覆修正</b>。</p>
<h3>模擬與實測對不上——除錯清單</h3><p>按最常見排序：<b>(1) 沒建進模型的東西</b>（同軸線本身、連接器、夾具支架轉台、有限地板）；<b>(2) 平衡/不平衡問題</b>——缺巴倫導致同軸外皮電流參與輻射，<b>這是最經典的「模擬漂亮、實測災難」原因</b>；<b>(3) 材料參數不對</b>（資料表的 ε_r 與 tanδ 會隨頻率溫度漂移，<b>諧振頻率系統性偏移先懷疑 ε_r</b>）；<b>(4) 製造誤差</b>（過蝕/欠蝕、對位、焊錫量）；<b>(5) 量測問題</b>；<b>(6) 模擬設定</b>（網格不收斂、邊界太近、掃頻太疏）。</p>
<p><b>除錯的正確順序</b>：先確認量測可信（用已知天線驗證量測系統），再確認模擬收斂，最後才逐項補齊模型缺漏。</p>
<h3>陣列的特殊考量</h3><p>場型相乘原理假設所有單元場型相同，但實際有<b>互耦</b>：邊緣效應、<b>主動阻抗</b>隨掃描角變化、極端情況出現<b>掃描盲點</b>（某角度激發表面波，反射係數逼近 1，天線完全失效）。<b>實務做法</b>：用<b>無限陣列模型</b>（週期邊界+Floquet 埠）分析主動阻抗隨掃描角的變化，比模擬整個有限陣列快數個量級，且能直接揭露掃描盲點。</p>`},
];

 let html='<div class="note"><div class="crumbs"><span class="tag" style="background:'+CATS[n.cat].raw+'33;color:'+CATS[n.cat].raw+'">'+CATS[n.cat].name+'</span></div>'+

 const ex=EXTRA[id];
 if(ex){

function buildLegend(){document.getElementById('legend').innerHTML=Object.keys(CATS).map(k=>'<div><i style="background:'+CATS[k].raw+'"></i>'+CATS[k].name+'</div>').join('');}
const svg=document.getElementById('graph');
const SVGNS='http://www.w3.org/2000/svg';
const G={started:false,nodes:[],edges:[],raf:null};
function startGraph(){
 if(G.started)return;G.started=true;buildLegend();
 const W=svg.clientWidth||900,H=svg.clientHeight||600;
 const deg={};EDGES.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;});
 G.nodes=NOTES.map((n,i)=>({id:n.id,cat:n.cat,x:W/2+Math.cos(i/NOTES.length*6.283)*240+(Math.random()-.5)*40,y:H/2+Math.sin(i/NOTES.length*6.283)*190+(Math.random()-.5)*40,vx:0,vy:0,r:8+(deg[n.id]||1)*1.5}));
 const pos=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 const gE=document.createElementNS(SVGNS,'g'),gN=document.createElementNS(SVGNS,'g');svg.appendChild(gE);svg.appendChild(gN);
 G.edges=EDGES.map(([a,b])=>{const l=document.createElementNS(SVGNS,'line');l.setAttribute('class','gedge');gE.appendChild(l);return{a,b,el:l};});
 G.nodes.forEach(n=>{
  const g=document.createElementNS(SVGNS,'g');g.setAttribute('class','gnode');g.dataset.id=n.id;
  const c=document.createElementNS(SVGNS,'circle');c.setAttribute('r',n.r);c.setAttribute('fill',CATS[n.cat].raw);c.setAttribute('stroke','#ffffff');c.setAttribute('stroke-width','2.5');
  const t=document.createElementNS(SVGNS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('dy',-n.r-6);t.textContent=n.id;
  g.appendChild(c);g.appendChild(t);gN.appendChild(g);n.el=g;
  g.addEventListener('mouseenter',()=>highlight(n.id,true));g.addEventListener('mouseleave',()=>highlight(n.id,false));
  let moved=false,down=false,ox,oy;
  g.addEventListener('pointerdown',ev=>{down=true;moved=false;n.fixed=true;const p=toSvg(ev);ox=p.x-n.x;oy=p.y-n.y;g.setPointerCapture(ev.pointerId);});
  g.addEventListener('pointermove',ev=>{if(!down)return;const p=toSvg(ev);n.x=p.x-ox;n.y=p.y-oy;n.vx=0;n.vy=0;moved=true;});
  g.addEventListener('pointerup',()=>{down=false;n.fixed=false;if(!moved)open(n.id);});
 });
 gloop(pos,W,H);
}
function toSvg(ev){const r=svg.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
function highlight(id,on){const nb=new Set(neighborsOf(id));nb.add(id);
 G.nodes.forEach(n=>{n.el.style.opacity=on?(nb.has(n.id)?1:.2):1;});
 G.edges.forEach(e=>{const rel=(e.a===id||e.b===id);e.el.classList.toggle('hl',on&&rel);e.el.style.opacity=on?(rel?1:.12):1;});}
function gloop(pos,W,H){const KR=5200,KS=0.012,L0=118,DA=0.86,GR=0.008;
 function step(){const ns=G.nodes;
  for(let i=0;i<ns.length;i++){const a=ns[i];if(a.fixed)continue;let fx=0,fy=0;
   for(let j=0;j<ns.length;j++){if(i===j)continue;const b=ns[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);const f=KR/d2;fx+=dx/d*f;fy+=dy/d*f;}
   fx+=(W/2-a.x)*GR;fy+=(H/2-a.y)*GR;a.vx=(a.vx+fx)*DA;a.vy=(a.vy+fy)*DA;}
  EDGES.forEach(([ai,bi])=>{const a=pos[ai],b=pos[bi];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const f=(d-L0)*KS,ux=dx/d,uy=dy/d;if(!a.fixed){a.vx+=ux*f;a.vy+=uy*f;}if(!b.fixed){b.vx-=ux*f;b.vy-=uy*f;}});
  ns.forEach(n=>{if(n.fixed)return;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(n.r+40,Math.min(W-n.r-40,n.x));n.y=Math.max(n.r+30,Math.min(H-n.r-20,n.y));});
  G.edges.forEach(e=>{const a=pos[e.a],b=pos[e.b];e.el.setAttribute('x1',a.x);e.el.setAttribute('y1',a.y);e.el.setAttribute('x2',b.x);e.el.setAttribute('y2',b.y);});
  ns.forEach(n=>n.el.setAttribute('transform','translate('+n.x+','+n.y+')'));
  G.raf=requestAnimationFrame(step);}
 step();}

/* ---- 1. 偶極場型 ---- */
function toolDipole(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>偶極總長度 L = <span id="dpLV">0.50</span> λ<input id="dpL" type="range" min="10" max="200" value="50"></label>'+
  '</div><canvas id="dpCanvas" width="640" height="360"></canvas>'+
  '<div class="d" id="dpNote"></div></div>';
 document.getElementById('dpL').oninput=drawDipole;
 drawDipole();
}
function dipolePattern(theta,Llam){
 const st=Math.sin(theta), ct=Math.cos(theta);
 if(Math.abs(st)<1e-6)return 0;
 const bL=Math.PI*Llam; // beta*L/2 = pi*L/lambda
 return Math.abs((Math.cos(bL*ct)-Math.cos(bL))/st);
}
function drawDipole(){
 const Llam=(+document.getElementById('dpL').value)/100;
 document.getElementById('dpLV').textContent=Llam.toFixed(2);
 const cv=document.getElementById('dpCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const cx=320,cy=180,R=140;
 let maxF=0;
 for(let i=0;i<=720;i++){const f=dipolePattern(Math.PI*i/720,Llam);if(f>maxF)maxF=f;}
 if(maxF<1e-9)maxF=1;
 for(const rr of [R/3,2*R/3,R]){ctx.strokeStyle='#e6eef2';ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();}
 ctx.strokeStyle='#e6eef2';ctx.beginPath();ctx.moveTo(cx-R-14,cy);ctx.lineTo(cx+R+14,cy);ctx.moveTo(cx,cy-R-14);ctx.lineTo(cx,cy+R+14);ctx.stroke();
 ctx.beginPath();
 for(let i=0;i<=720;i++){
  const th=2*Math.PI*i/720;
  const f=dipolePattern(th,Llam)/maxF;
  const x=cx+R*f*Math.sin(th), y=cy-R*f*Math.cos(th);
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.closePath();
 ctx.fillStyle='rgba(8,145,178,0.22)';ctx.fill();
 ctx.strokeStyle='#0891b2';ctx.lineWidth=2.5;ctx.stroke();
 const halfPix=Math.min(R*0.55,R*Llam*0.8);
 ctx.strokeStyle='#123039';ctx.lineWidth=5;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(cx,cy-halfPix);ctx.lineTo(cx,cy+halfPix);ctx.stroke();
 ctx.lineWidth=1;
 // HPBW estimate
 let thMax=0,fm=0;
 for(let i=1;i<720;i++){const th=Math.PI*i/720;const f=dipolePattern(th,Llam);if(f>fm){fm=f;thMax=th;}}
 let hp=null;
 for(let i=1;i<720;i++){
  const th=Math.PI*i/720;
  if(th<=thMax)continue;
  if(dipolePattern(th,Llam)/maxF<=Math.SQRT1_2){hp=2*(th-thMax)*180/Math.PI;break;}
 }
 // directivity via numeric integration
 let P=0;const M=2000;
 for(let i=1;i<M;i++){const th=Math.PI*i/M;const f=dipolePattern(th,Llam);P+=f*f*Math.sin(th)*(Math.PI/M);}
 P*=2*Math.PI;
 const D=P>1e-12?(4*Math.PI*maxF*maxF/P):0;
 ctx.font='12px sans-serif';ctx.fillStyle='#4d6b76';ctx.textAlign='center';
 ctx.fillText('軸向（零輻射）',cx,cy-R-22);
 ctx.fillText('E 面場型（含軸平面）',cx,cy+R+34);
 let msg='方向性 D ≈ <b>'+D.toFixed(2)+'</b>（'+(10*Math.log10(D)).toFixed(2)+' dBi）';
 if(hp)msg+='，主瓣 HPBW ≈ <b>'+hp.toFixed(0)+'°</b>';
 if(Llam<0.55)msg+='。此區間場型接近 sinθ 甜甜圈，L=0.5λ 時 D=1.64（2.15 dBi）、Zin≈73+j42.5Ω。';
 else if(Llam<1.3)msg+='。長度超過 0.5λ 後主瓣開始變窄、方向性上升。';
 else msg+='。<b>長度超過約 1.2λ 後，電流駐波出現反相段</b>，主瓣分裂、旁瓣冒出——這就是為什麼實用偶極停在半波長附近，再長下去場型會失控。';
 document.getElementById('dpNote').innerHTML=msg;
}

/* ---- 2. 陣列因子與柵瓣 ---- */
function toolArray(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>單元數 N = <span id="arNV">8</span><input id="arN" type="range" min="2" max="32" value="8"></label>'+
  '<label>單元間距 d = <span id="arDV">0.50</span> λ<input id="arD" type="range" min="20" max="150" value="50"></label>'+
  '<label>掃描角 θs = <span id="arSV">0</span>°<input id="arS" type="range" min="-70" max="70" value="0"></label>'+
  '</div><canvas id="arCanvas" width="640" height="330"></canvas>'+
  '<div class="d" id="arNote"></div></div>';
 ['arN','arD','arS'].forEach(id=>document.getElementById(id).oninput=drawArray);
 drawArray();
}
function drawArray(){
 const N=+document.getElementById('arN').value;
 const d=(+document.getElementById('arD').value)/100;
 const ts=(+document.getElementById('arS').value)*Math.PI/180;
 document.getElementById('arNV').textContent=N;
 document.getElementById('arDV').textContent=d.toFixed(2);
 document.getElementById('arSV').textContent=(ts*180/Math.PI).toFixed(0);
 const cv=document.getElementById('arCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=60,oy=270,axw=545,axh=225;
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+axw,oy);ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-axh);ctx.stroke();
 for(const [db,lab] of [[0,'0'],[-13.5,'−13.5'],[-20,'−20'],[-30,'−30'],[-40,'−40']]){
  const y=oy-axh*(db+40)/40;
  ctx.strokeStyle=(db===-13.5)?'#e11d48':'#eef4f7';
  ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+axw,y);ctx.stroke();
  ctx.fillStyle='#4d6b76';ctx.font='10.5px sans-serif';ctx.textAlign='right';ctx.fillText(lab,ox-5,y+3);
 }
 const alpha=-2*Math.PI*d*Math.sin(ts);
 function afdb(thDeg){
  const th=thDeg*Math.PI/180;
  const psi=2*Math.PI*d*Math.sin(th)+alpha;
  const s2=Math.sin(psi/2);
  let v;
  if(Math.abs(s2)<1e-9)v=1;else v=Math.abs(Math.sin(N*psi/2)/(N*s2));
  return Math.max(20*Math.log10(Math.max(v,1e-5)),-40);
 }
 ctx.strokeStyle='#0891b2';ctx.lineWidth=2;ctx.beginPath();
 for(let i=0;i<=900;i++){
  const thd=-90+180*i/900;
  const db=afdb(thd);
  const x=ox+axw*(thd+90)/180, y=oy-axh*(db+40)/40;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();
 // detect grating lobes: peaks near 0 dB other than main
 const tsDeg=ts*180/Math.PI;
 let gl=[];
 for(let thd=-90;thd<=90;thd+=0.25){
  if(Math.abs(thd-tsDeg)<3)continue;
  if(afdb(thd)>-1.0){
   if(!gl.some(g=>Math.abs(g-thd)<6))gl.push(thd);
  }
 }
 for(const g of gl){
  const x=ox+axw*(g+90)/180;
  ctx.strokeStyle='#e11d48';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,oy);ctx.lineTo(x,oy-axh);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#e11d48';ctx.font='bold 11.5px sans-serif';ctx.textAlign='center';ctx.fillText('柵瓣',x,oy-axh-6);
 }
 const xm=ox+axw*(tsDeg+90)/180;
 ctx.strokeStyle='#059669';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(xm,oy);ctx.lineTo(xm,oy-axh);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#059669';ctx.font='bold 11.5px sans-serif';ctx.textAlign='center';ctx.fillText('主瓣',xm,oy-axh-6);
 ctx.fillStyle='#4d6b76';ctx.font='11px sans-serif';
 for(const t of [-90,-60,-30,0,30,60,90]){
  const x=ox+axw*(t+90)/180;
  ctx.fillText(t+'°',x,oy+16);
 }
 ctx.textAlign='left';ctx.fillText('dB',ox-38,oy-axh-6);
 const dmax=1/(1+Math.abs(Math.sin(ts)));
 const G=10*Math.log10(N);
 let msg='陣列增益相對單一單元 <b>+'+G.toFixed(1)+' dB</b>（N 倍）。此掃描角下的柵瓣避免條件為 d/λ &lt; <b>'+dmax.toFixed(3)+'</b>，目前 d/λ = '+d.toFixed(2)+'。';
 if(gl.length>0)msg+=' <b style="color:#e11d48">目前已出現 '+gl.length+' 個柵瓣</b>——間距過大，能量被送到錯誤方向。把 d 調小或縮小掃描角即可消除。';
 else msg+=' 目前無柵瓣。試著把 d 調大、或把掃描角拉到 ±70°，就能看到柵瓣從視野邊緣冒出來。';
 document.getElementById('arNote').innerHTML=msg;
}

function toolReflector(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>碟緣照度（相對中心） <span id="rfTV">-10</span> dB<input id="rfT" type="range" min="-25" max="-2" value="-10"></label>'+

function reflEff(taperDb){
 const t=-taperDb;
 const spill=1-Math.exp(-0.42*t);
 const taper=Math.exp(-Math.pow(t/22,1.9));
 return {spill:spill,taper:taper,total:spill*taper};
}
function drawReflector(){
 const tdb=+document.getElementById('rfT').value;
 const D=(+document.getElementById('rfD').value)/10;
 const f=+document.getElementById('rfF').value;
 const eDiv=+document.getElementById('rfE').value;
 document.getElementById('rfTV').textContent=tdb;
 document.getElementById('rfDV').textContent=D.toFixed(1);
 document.getElementById('rfFV').textContent=f;
 document.getElementById('rfEV').textContent=eDiv;
 const lam=0.3/f;
 const e=reflEff(tdb);
 const ruze=Math.exp(-Math.pow(4*Math.PI/eDiv,2));
 const etaTot=e.total*ruze*0.95;
 const G=10*Math.log10(etaTot*Math.pow(Math.PI*D/lam,2));
 const hpbw=70*lam/D;
 const cv=document.getElementById('rfCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=70,oy=240,axw=540,axh=195;
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+axw,oy);ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-axh);ctx.stroke();
 function plot(fn,color,lw,dash){
  ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);
  ctx.beginPath();
  for(let i=0;i<=200;i++){
   const td=-2-23*i/200;
   const v=fn(reflEff(td));
   const x=ox+axw*i/200, y=oy-axh*v;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.setLineDash([]);
 }
 plot(r=>r.spill,'#059669',2,[6,4]);
 plot(r=>r.taper,'#d97706',2,[6,4]);
 plot(r=>r.total,'#e11d48',3);
 const px=ox+axw*((-2-tdb)/23);
 const py=oy-axh*e.total;
 ctx.fillStyle='#e11d48';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#e11d48';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,oy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#4d6b76';ctx.font='11.5px sans-serif';ctx.textAlign='center';
 ctx.fillText('−2dB（照射均勻、溢波多）',ox+70,oy+18);
 ctx.fillText('−25dB（錐削重）',ox+axw-60,oy+18);
 ctx.textAlign='left';ctx.fillText('效率',ox-40,oy-axh-4);
 const lg=[['溢波 ηsp','#059669'],['錐削 ηt','#d97706'],['總效率','#e11d48']];
 lg.forEach((L,i)=>{const x=ox+40+i*160,y=oy+42;ctx.strokeStyle=L[1];ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x+22,y-4);ctx.stroke();ctx.fillStyle='#4d6b76';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(L[0],x+28,y);});
 const ruzeDb=-10*Math.log10(ruze);
 document.getElementById('rfNote').innerHTML='目前孔徑效率：溢波 '+(e.spill*100).toFixed(0)+'% × 錐削 '+(e.taper*100).toFixed(0)+'% × Ruze '+(ruze*100).toFixed(0)+'% ⟹ 總效率約 <b>'+(etaTot*100).toFixed(0)+'%</b>。'+
  '增益 ≈ <b>'+G.toFixed(1)+' dBi</b>，HPBW ≈ <b>'+hpbw.toFixed(2)+'°</b>，表面誤差造成的損失 <b>'+ruzeDb.toFixed(2)+' dB</b>。'+
  '把碟緣照度滑到 −10dB 附近會看到總效率達到最大——這就是那條經典設計法則的由來。把頻率調高會發現 Ruze 損失急遽惡化：同一面碟在高頻的表面精度要求嚴苛得多。';
}

/* ---- 4. Friis 鏈路預算 ---- */
function toolFriis(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>發射功率 <span id="frPV">10</span> dBW<input id="frP" type="range" min="-10" max="40" value="10"></label>'+
  '<label>發射增益 <span id="frGtV">20</span> dBi<input id="frGt" type="range" min="0" max="60" value="20"></label>'+
  '<label>接收增益 <span id="frGrV">20</span> dBi<input id="frGr" type="range" min="0" max="60" value="20"></label>'+
  '<label>距離 <span id="frRV">10</span> km<input id="frR" type="range" min="1" max="40000" value="10"></label>'+
  '<label>頻率 <span id="frFV">12</span> GHz<input id="frF" type="range" min="1" max="100" value="12"></label>'+
  '<label>極化失配 <span id="frLV">0</span> dB<input id="frL" type="range" min="0" max="6" value="0"></label>'+
  '</div><canvas id="frCanvas" width="640" height="270"></canvas>'+
  '<div class="d" id="frNote"></div></div>';
 ['frP','frGt','frGr','frR','frF','frL'].forEach(id=>document.getElementById(id).oninput=drawFriis);
 drawFriis();
}
function drawFriis(){
 const Pt=+document.getElementById('frP').value;
 const Gt=+document.getElementById('frGt').value;
 const Gr=+document.getElementById('frGr').value;
 const Rkm=+document.getElementById('frR').value;
 const fG=+document.getElementById('frF').value;
 const Lpol=+document.getElementById('frL').value;
 document.getElementById('frPV').textContent=Pt;
 document.getElementById('frGtV').textContent=Gt;
 document.getElementById('frGrV').textContent=Gr;
 document.getElementById('frRV').textContent=Rkm;
 document.getElementById('frFV').textContent=fG;
 document.getElementById('frLV').textContent=Lpol;
 const R=Rkm*1000, f=fG*1e9;
 const fspl=20*Math.log10(R)+20*Math.log10(f)-147.55;
 const EIRP=Pt+Gt;
 const Pr=EIRP-fspl-Lpol+Gr;
 const cv=document.getElementById('frCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const items=[['EIRP',EIRP,'#059669'],['−FSPL',-fspl,'#e11d48'],['−極化',-Lpol,'#d97706'],['+Gr',Gr,'#0891b2']];
 const ox=60,oy=180,barW=88,gap=46;
 let running=0;
 const scale=1.05;
 ctx.font='11.5px sans-serif';
 items.forEach((it,i)=>{
  const x=ox+i*(barW+gap);
  const h=Math.abs(it[1])*scale;
  const yTop=it[1]>=0?oy-running*scale-h:oy-running*scale;
  ctx.fillStyle=it[2];
  ctx.globalAlpha=0.85;
  ctx.fillRect(x,Math.max(yTop,10),barW,Math.max(Math.min(h,240),2));
  ctx.globalAlpha=1;
  ctx.fillStyle='#123039';ctx.textAlign='center';ctx.font='bold 12px sans-serif';
  ctx.fillText((it[1]>=0?'+':'')+it[1].toFixed(1),x+barW/2,Math.max(yTop,10)-6);
  ctx.fillStyle='#4d6b76';ctx.font='12px sans-serif';
  ctx.fillText(it[0],x+barW/2,oy+40);
  running+=it[1];
 });
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(40,oy);ctx.lineTo(600,oy);ctx.stroke();
 ctx.fillStyle='#123039';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
 ctx.fillText('接收功率 Pr = '+Pr.toFixed(1)+' dBW = '+(Pr+30).toFixed(1)+' dBm',60,240);
 document.getElementById('frNote').innerHTML='FSPL = <b>'+fspl.toFixed(1)+' dB</b>，接收功率 <b>'+(Pr+30).toFixed(1)+' dBm</b>。'+
  '<br><b>試試看這個關鍵實驗</b>：只把頻率調高，接收功率會下降（因為增益固定時高頻孔徑較小）；但如果同時把收發增益各加 +6dB（相當於頻率加倍時保持孔徑不變），總功率反而會上升——這正是「FSPL 的 λ² 不是真的傳播損耗」的意思。';
}

/* ---- 5. G/T 雜訊分析 ---- */
function toolGT(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>天線增益 <span id="gtGV">50</span> dBi<input id="gtG" type="range" min="20" max="75" value="50"></label>'+
  '<label>主瓣指向天空溫度 <span id="gtSV">10</span> K<input id="gtS" type="range" min="3" max="100" value="10"></label>'+
  '<label>旁瓣漏向地面比例 <span id="gtBV">5</span> %<input id="gtB" type="range" min="0" max="30" value="5"></label>'+
  '<label>LNA 雜訊溫度 <span id="gtLV">30</span> K<input id="gtL" type="range" min="4" max="150" value="30"></label>'+
  '<label>LNA 前饋線損耗 <span id="gtFV">0.2</span> dB<input id="gtF" type="range" min="0" max="30" value="2"></label>'+
  '</div><canvas id="gtCanvas" width="640" height="280"></canvas>'+
  '<div class="d" id="gtNote"></div></div>';
 ['gtG','gtS','gtB','gtL','gtF'].forEach(id=>document.getElementById(id).oninput=drawGT);
 drawGT();
}
function drawGT(){
 const G=+document.getElementById('gtG').value;
 const Tsky=+document.getElementById('gtS').value;
 const beta=(+document.getElementById('gtB').value)/100;
 const Tlna=+document.getElementById('gtL').value;
 const Ldb=(+document.getElementById('gtF').value)/10;
 document.getElementById('gtGV').textContent=G;
 document.getElementById('gtSV').textContent=Tsky;
 document.getElementById('gtBV').textContent=(beta*100).toFixed(0);
 document.getElementById('gtLV').textContent=Tlna;
 document.getElementById('gtFV').textContent=Ldb.toFixed(1);
 const Tground=290, T0=290;
 const TA=(1-beta)*Tsky+beta*Tground;
 const Llin=Math.pow(10,Ldb/10);
 const Tline=(Llin-1)*T0;
 const Tsys=TA+Tline+Tlna;
 const GT=G-10*Math.log10(Tsys);
 const cv=document.getElementById('gtCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const parts=[['天空（主瓣）',(1-beta)*Tsky,'#0891b2'],['地面（旁瓣）',beta*Tground,'#e11d48'],['饋線損耗',Tline,'#d97706'],['LNA',Tlna,'#7c3aed']];
 const ox=70,oy=200,axw=500;
 let acc=0;
 const scale=axw/Math.max(Tsys,1);
 ctx.font='12px sans-serif';
 parts.forEach(p=>{
  const w=p[1]*scale;
  ctx.fillStyle=p[2];ctx.globalAlpha=0.85;
  ctx.fillRect(ox+acc*scale,oy-56,Math.max(w,0),56);
  ctx.globalAlpha=1;
  acc+=p[1];
 });
 ctx.strokeStyle='#d5e5ec';ctx.strokeRect(ox,oy-56,axw,56);
 let ly=oy+28;
 parts.forEach((p,i)=>{
  const x=ox+(i%2)*260, y=ly+Math.floor(i/2)*24;
  ctx.fillStyle=p[2];ctx.fillRect(x,y-10,14,12);
  ctx.fillStyle='#4d6b76';ctx.font='12.5px sans-serif';ctx.textAlign='left';
  ctx.fillText(p[0]+'：'+p[1].toFixed(1)+' K（'+(100*p[1]/Tsys).toFixed(0)+'%）',x+20,y);
 });
 ctx.fillStyle='#123039';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
 ctx.fillText('T_sys = '+Tsys.toFixed(1)+' K',ox,oy-70);
 ctx.fillText('G/T = '+GT.toFixed(1)+' dB/K',ox+280,oy-70);
 const TAclean=Tsky;
 const TsysClean=TAclean+Tline+Tlna;
 const penalty=10*Math.log10(Tsys/TsysClean);
 document.getElementById('gtNote').innerHTML='系統雜訊溫度 <b>'+Tsys.toFixed(1)+' K</b>，<b>G/T = '+GT.toFixed(1)+' dB/K</b>。'+
  '目前旁瓣漏向 290K 地面的部分，讓 G/T 惡化了 <b>'+penalty.toFixed(2)+' dB</b>。'+
  '<br><b>試試這個關鍵實驗</b>：把旁瓣比例從 0% 拉到 5%，再看 G/T 掉多少——會發現它經常比 +0.5dB 的增益提升還嚴重。這就是為什麼接收系統寧可犧牲增益去壓旁瓣。也試著把饋線損耗從 0 拉到 1dB，看它注入多少 K。';
}

/* ---- 6. Chu 極限 ---- */
function toolChu(box){
 box.innerHTML='<div class="tool"><div class="row">'+
  '<label>天線半徑 a = <span id="chAV">0.10</span> λ<input id="chA" type="range" min="2" max="60" value="10"></label>'+
  '<label>體積利用率 <span id="chUV">100</span> %<input id="chU" type="range" min="10" max="100" value="100"></label>'+
  '<label>輻射效率 <span id="chEV">100</span> %<input id="chE" type="range" min="10" max="100" value="100"></label>'+
  '</div><canvas id="chCanvas" width="640" height="300"></canvas>'+
  '<div class="d" id="chNote"></div></div>';
 ['chA','chU','chE'].forEach(id=>document.getElementById(id).oninput=drawChu);
 drawChu();
}
function chuQ(ka){return 1/Math.pow(ka,3)+1/ka;}
function drawChu(){
 const aLam=(+document.getElementById('chA').value)/100;
 const util=(+document.getElementById('chU').value)/100;
 const eff=(+document.getElementById('chE').value)/100;
 document.getElementById('chAV').textContent=aLam.toFixed(2);
 document.getElementById('chUV').textContent=(util*100).toFixed(0);
 document.getElementById('chEV').textContent=(eff*100).toFixed(0);
 const ka=2*Math.PI*aLam;
 const Qmin=chuQ(ka);
 const Qreal=Qmin/util;
 const Qeff=Qreal*eff;
 const BW=100/Qeff;
 const cv=document.getElementById('chCanvas'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 const ox=70,oy=240,axw=540,axh=200;
 ctx.strokeStyle='#8aa4ae';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+axw,oy);ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-axh);ctx.stroke();
 const kaMin=0.1,kaMax=3;
 function xOf(k){return ox+axw*(Math.log(k/kaMin)/Math.log(kaMax/kaMin));}
 function yOf(bw){const v=Math.log10(Math.max(bw,0.01));return oy-axh*(v+2)/4;}
 ctx.strokeStyle='#0891b2';ctx.lineWidth=3;ctx.beginPath();
 for(let i=0;i<=300;i++){
  const k=kaMin*Math.pow(kaMax/kaMin,i/300);
  const bw=100/chuQ(k);
  const x=xOf(k),y=yOf(bw);
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();
 for(const [bw,lab] of [[100,'100%'],[10,'10%'],[1,'1%'],[0.1,'0.1%']]){
  const y=yOf(bw);
  ctx.strokeStyle='#eef4f7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+axw,y);ctx.stroke();
  ctx.fillStyle='#4d6b76';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText(lab,ox-5,y+3);
 }
 for(const k of [0.1,0.2,0.5,1,2,3]){
  const x=xOf(k);
  ctx.fillStyle='#4d6b76';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('ka='+k,x,oy+16);
 }
 const px=xOf(Math.max(Math.min(ka,kaMax),kaMin)),py=yOf(BW);
 ctx.fillStyle='#e11d48';ctx.beginPath();ctx.arc(px,Math.max(py,12),7,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#e11d48';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,oy);ctx.lineTo(px,Math.max(py,12));ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#4d6b76';ctx.font='12px sans-serif';ctx.textAlign='left';
 ctx.fillText('理論最大頻寬（Chu 極限）',ox+12,yOf(100)-8);
 ctx.save();ctx.translate(ox-46,oy-axh/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('可達頻寬',0,0);ctx.restore();
 let zone;
 if(ka<0.5)zone='<b>電小天線區</b>——Q 以 1/(ka)³ 暴增，頻寬崩塌。這裡是手機、IoT、NFC 天線的戰場，設計的重點不是「做更小」，而是把可用體積填滿以逼近理論極限。';
 else if(ka<1.5)zone='過渡區——已經能取得實用頻寬，半波偶極大約落在這附近。';
 else zone='<b>電大天線區</b>——不再受 Chu 極限實質限制，頻寬由結構本身決定（喇叭、對數週期、反射面都在這裡）。';
 document.getElementById('chNote').innerHTML='ka = <b>'+ka.toFixed(2)+'</b>，理論最小 Q = <b>'+Qmin.toFixed(1)+'</b>，'+
  '考慮體積利用率與效率後實際 Q ≈ <b>'+Qeff.toFixed(1)+'</b>，可達頻寬約 <b>'+BW.toFixed(2)+'%</b>。'+zone+
  '<br><b>試試看</b>：把「輻射效率」往下拉，會看到頻寬變寬——這就是某些超小型商用天線「作弊」的方式：用損耗換取漂亮的 S₁₁，但實際輻射效率極差。';
}

buildSidebar();renderHome();
